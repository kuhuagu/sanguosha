<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国杀 · 风林火山</title>
<style>
:root{
  --ink:#2b2118; --paper:#e8dcc0; --paper2:#d8c9a3; --gold:#c9a227; --gold2:#8a6d1d;
  --shu:#b03a2e; --wei:#1f618d; --wu:#1e8449; --qun:#7d6608;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"STKaiti","KaiTi","LiSu","Noto Serif SC",serif; color:var(--ink);
  background:radial-gradient(1200px 700px at 50% 30%, #4a3b28 0%, #2e2416 60%, #1d160c 100%);
  overflow:hidden; user-select:none;
}
#app{display:grid; grid-template-columns:1fr 300px; grid-template-rows:auto 1fr auto; height:100vh; gap:6px; padding:8px 12px 20px;}
header{grid-column:1/3; display:flex; align-items:center; gap:16px; padding:4px 10px;}
header h1{color:var(--gold); font-size:24px; letter-spacing:6px; text-shadow:0 2px 4px #000;}
header .info{color:#cbb894; font-size:13px;}
header .sp{flex:1;}
header button{font-family:inherit;}
button{
  background:linear-gradient(#f5ecd2,#d8c9a3); border:1px solid var(--gold2); color:var(--ink);
  border-radius:6px; padding:5px 14px; font-size:14px; cursor:pointer; box-shadow:0 2px 4px rgba(0,0,0,.4);
}
button:hover{filter:brightness(1.06);}
button:disabled{opacity:.45; cursor:default;}
button.danger{background:linear-gradient(#e6b8af,#c88a7d);}
#board{position:relative; display:flex; flex-direction:column; min-height:0;}
#seats{display:flex; justify-content:space-evenly; align-items:flex-start; gap:8px; flex:0 0 auto; flex-wrap:wrap;}
#arena{flex:1; display:flex; align-items:center; justify-content:center; min-height:0;}
#arena .table{
  width:92%; max-width:900px; height:100%; min-height:60px; border:1px dashed rgba(201,162,39,.35); border-radius:14px;
  display:flex; align-items:center; justify-content:center; position:relative;
}
#arena .table .deck{display:flex; gap:14px; align-items:center; color:#cbb894;}
#prompt{
  min-height:30px; padding:5px 12px; margin:4px 0; border-radius:8px; text-align:center; font-size:15px;
  background:rgba(0,0,0,.35); color:#f0e2b6; border:1px solid rgba(201,162,39,.4); display:flex; gap:10px; align-items:center; justify-content:center;
}
#prompt button{font-size:13px; padding:3px 10px;}
#human{display:flex; gap:12px; align-items:stretch; flex:0 0 auto; margin-top:8px; padding:12px;
  background:linear-gradient(180deg, rgba(58,44,26,.55), rgba(24,17,9,.85));
  border:2px solid rgba(201,162,39,.55); border-radius:16px; box-shadow:0 0 22px rgba(0,0,0,.55), inset 0 0 30px rgba(0,0,0,.4);}
#humanInfo{width:252px; align-self:center;}
#humanInfo .seat{width:100%; border-color:#ffd76a; box-shadow:0 0 18px rgba(255,215,106,.4);}
#humanInfo .seat .hp{font-size:19px;}
#handWrap{flex:1; display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; align-content:flex-end; min-height:186px; padding:10px 10px 8px;
  background:rgba(0,0,0,.38); border:2px solid rgba(201,162,39,.5); border-radius:12px;
  box-shadow:inset 0 0 26px rgba(0,0,0,.6), 0 0 14px rgba(201,162,39,.12);}
#handWrap .minicard{width:104px; height:150px; font-size:15px; cursor:pointer; transition:transform .12s;}
#handWrap .minicard .suit{font-size:15px;}
#handWrap .minicard .cn{margin-top:56px; font-size:17px;}
#handWrap .minicard .desc{font-size:11px;}
/* 实体牌扫描图（cards_img/，来自实体卡拍摄）：图画铺满整个牌面 */
.minicard .cart{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 0; border-radius:inherit; border:0; background:#e8dcc0; pointer-events:none;}
.minicard:has(.cart) .cn{display:none;}
.minicard:has(.cart) .desc{display:none;}
.galRow img.gimg{width:54px; height:78px; object-fit:cover; object-position:50% 0; border-radius:5px; border:1px solid #8a6d1d; flex:0 0 auto; box-shadow:1px 2px 3px rgba(0,0,0,.3);}
.galRow span.gimg{display:inline-flex; align-items:center; justify-content:center; width:54px; height:78px; background:#f7efd9; color:#7a3c00; font-weight:bold; border:1px solid #8a6d1d; border-radius:5px; flex:0 0 auto;}
#handWrap .minicard.playable:hover{transform:translateY(-10px); box-shadow:0 8px 18px rgba(0,0,0,.6), 0 0 12px rgba(255,215,106,.5);}
#skills{display:flex; flex-direction:column; gap:7px; width:132px; justify-content:flex-end;}
#skills button{font-size:15px; padding:8px 10px;}
.seat{
  width:200px; background:linear-gradient(var(--paper),var(--paper2)); border:2px solid var(--gold2); border-radius:10px;
  padding:6px 8px; font-size:13px; position:relative; box-shadow:0 3px 8px rgba(0,0,0,.45);
}
.seat.cur{outline:3px solid #ffd76a; box-shadow:0 0 16px #ffd76a88;}
.seat.dead{opacity:.45; filter:grayscale(.8);}
.seat.targetable{outline:3px solid #58d68d; cursor:pointer; animation:pulse 1s infinite;}
.seat.hurt{animation:hurt .4s;}
@keyframes pulse{50%{box-shadow:0 0 18px #58d68d;}}
@keyframes hurt{25%{background:#e9a1a1;}75%{background:var(--paper);}}
.seat .top{display:flex; justify-content:space-between; align-items:center;}
.seat .gname{font-size:17px; font-weight:bold;}
.seat .name{font-size:13px; color:#5b4a33;}
.king{display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; border-radius:4px; color:#fff; font-size:12px; vertical-align:1px;}
.king.蜀{background:var(--shu);} .king.魏{background:var(--wei);} .king.吴{background:var(--wu);} .king.群{background:var(--qun);}
.role{display:inline-block; padding:0 6px; border-radius:4px; font-size:12px; color:#fff; background:#555;}
.role.主{background:#b7950b;} .role.忠{background:#1e8449;} .role.反{background:#922b21;} .role.内{background:#5d6d7e;} .role.？{background:#444;}
.hp{color:#b03a2e; font-size:15px; letter-spacing:2px;}
.hp .lost{color:#9e9689;}
.rowline{margin-top:3px; color:#4a3b28;}
.pile{display:inline-block; padding:1px 8px; background:#6d5a3a; color:#f2e7c9; border-radius:4px; font-size:12px;}
.zone{display:flex; flex-wrap:wrap; gap:3px; margin-top:3px;}
.tag{font-size:11px; padding:1px 6px; border-radius:4px; background:#7a6543; color:#f5ecd2;}
.tag.dly{background:#843b3b;}
#stage{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; z-index:6; transition:opacity .22s;}
#stage.on{opacity:1;}
#stage .swrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
#stage .srowcards{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:78vw;}
#stage .minicard{width:112px; height:160px; font-size:15px; box-shadow:0 0 30px rgba(255,215,106,.9);}
#stage .minicard .cn{margin-top:66px; font-size:15px;}
#stage .minicard .cn{margin-top:46px; font-size:20px;}
#stage .stagetext{background:rgba(0,0,0,.78); color:#f5e7bc; border:1px solid var(--gold); padding:7px 18px; border-radius:8px; font-size:16px; letter-spacing:1px; white-space:nowrap;}
/* —— 目标指向动画层 —— */
#fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:40; overflow:visible;}
#fx line.fxline{stroke-width:5; stroke-linecap:round; stroke-dasharray:14 10; animation:fxdash .55s linear infinite; filter:drop-shadow(0 0 7px #ffd76a);}
#fx circle.fxring{fill:none; stroke-width:4; animation:fxring 1s ease-out infinite; transform-box:fill-box; transform-origin:center;}
#fx polygon.fxhead{filter:drop-shadow(0 0 6px #ffd76a);}
@keyframes fxdash{to{stroke-dashoffset:-24;}}
@keyframes fxring{0%{stroke-opacity:.95; transform:scale(.55);}100%{stroke-opacity:0; transform:scale(1.35);}}
.seat.fxhit{outline:4px solid #ff6b57 !important; box-shadow:0 0 26px #ff6b57 !important; animation:fxhit .5s ease-in-out 2;}
.seat.fxhit2{outline:4px solid #7ec8ff !important; box-shadow:0 0 26px #7ec8ff !important;}
.seat.fxhitg{outline:4px solid #7dcea0 !important; box-shadow:0 0 26px #7dcea0 !important;}
@keyframes fxhit{50%{transform:translateY(-5px) scale(1.03);}}
/* —— 武将头像徽记 —— */
.ava{--c1:#666; --c2:#333; width:52px; height:52px; border-radius:50%; position:relative; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.5), transparent 55%), linear-gradient(135deg, var(--c1), var(--c2));
  border:2px solid #d4af37; box-shadow:0 2px 8px rgba(0,0,0,.55), inset 0 0 10px rgba(0,0,0,.35);}
.ava .ac{color:#fdf6e3; font-size:26px; font-weight:bold; text-shadow:0 2px 3px rgba(0,0,0,.75); line-height:1; margin-top:-2px;
  font-family:"STKaiti","KaiTi","LiSu",serif;}
.ava .ai{position:absolute; bottom:-5px; right:-7px; font-size:15px; background:#241a0e; border:1px solid #d4af37; border-radius:50%; padding:1px 2px; line-height:1.15;}
.ava.蜀{--c1:#d05548; --c2:#6e1d15;} .ava.魏{--c1:#3f7fae; --c2:#123a56;} .ava.吴{--c1:#3aa05f; --c2:#0d4a26;} .ava.群{--c1:#b09128; --c2:#574408;}
.ava.sm{width:40px; height:40px;} .ava.sm .ac{font-size:20px;} .ava.sm .ai{font-size:12px; right:-4px;}
.ava.big{width:74px; height:74px;} .ava.big .ac{font-size:38px;} .ava.big .ai{font-size:22px;}
.seat .srow{display:flex; gap:9px; align-items:center;}
.seat .sinfo{flex:1; min-width:0;}
.modpic{margin:2px auto 8px; width:74px;}
.turnchip{display:inline-flex; align-items:center; gap:7px; vertical-align:middle; background:rgba(201,162,39,.16); border:1px solid rgba(201,162,39,.5); border-radius:20px; padding:2px 12px 2px 4px; margin-right:8px;}
.turnchip .tname{color:#ffe9a8; font-size:14px; letter-spacing:1px;}
/* —— 联机大厅 / 等待 —— */
#lobby input{font-family:inherit; font-size:15px; padding:6px 10px; border:1px solid var(--gold2); border-radius:6px; background:#f7efd9; color:var(--ink); text-align:center;}
#lobby .code{font-size:30px; letter-spacing:8px; color:#8a2f1d; font-weight:bold; margin:6px 0; user-select:all;}
#lobby .plist{margin:8px 0; font-size:14px; text-align:left; display:inline-block;}
.minicard{
  display:inline-block; width:66px; height:96px; border-radius:7px; border:1px solid #3f3222; background:#f7efd9;
  text-align:center; position:relative; font-size:13px; cursor:default; box-shadow:1px 2px 4px rgba(0,0,0,.35);
}
.minicard .suit{position:absolute; top:3px; left:4px; z-index:2; font-size:13px; background:rgba(250,244,224,.92); border-radius:4px; padding:0 3px; line-height:1.35; box-shadow:0 1px 2px rgba(0,0,0,.3);}
.minicard .cn{margin-top:26px; font-weight:bold; letter-spacing:1px;}
.minicard .desc{position:absolute; bottom:3px; left:0; right:0; font-size:9px; color:#6a5a40; line-height:1.05; padding:0 2px;}
.minicard.红{color:#a93226;} .minicard.黑{color:#1c2833;}
.minicard.sel{transform:translateY(-12px); box-shadow:0 0 10px #ffd76a; border-color:#ffd76a;}
.minicard.playable:hover{transform:translateY(-6px);}
.minicard.dim{opacity:.5;}
#log{background:rgba(0,0,0,.4); border:1px solid rgba(201,162,39,.3); border-radius:10px; padding:8px; overflow-y:auto; font-size:12.5px; color:#e6d9b8; grid-row:2/4; grid-column:2;}
#log p{margin:2px 0; line-height:1.35; border-bottom:1px dashed rgba(255,255,255,.06); padding-bottom:2px;}
#log p.dmg{color:#f1948a;} #log p.heal{color:#7dcea0;} #log p.judge{color:#a9cce3;}
#log p.death{color:#f7dc6f; font-weight:bold;} #log p.turn{color:#ffd76a; margin-top:6px;}
#log p.skill{color:#d7bde2;} #log p.sys{color:#aab7b8;}
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50;
}
.panel{
  background:linear-gradient(var(--paper),var(--paper2)); border:3px solid var(--gold2); border-radius:14px;
  padding:22px 30px; max-width:560px; min-width:320px; text-align:center; box-shadow:0 10px 40px #000;
}
.panel h2{margin-bottom:10px; color:var(--gold2); letter-spacing:3px;}
.panel .sub{font-size:13px; color:#5b4a33; margin-bottom:14px; line-height:1.6; max-height:280px; overflow-y:auto;}
.panel .btns{display:flex; flex-direction:column; gap:8px; align-items:stretch;}
.panel .cards{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:8px 0;}
.hidden{display:none !important;}
/* —— 台词气泡 / 阶段提示 / 图鉴 / 装备可交互 —— */
.seat,#humanInfo{position:relative;}
.say{position:absolute; left:0; top:0; z-index:30; background:#fffbe8; border:1px solid #8a6d1a; color:#3a2b12;
  font-size:13px; font-style:italic; padding:4px 10px; border-radius:10px; box-shadow:0 3px 12px rgba(0,0,0,.4);
  max-width:230px; animation:sayIn .22s ease-out; pointer-events:none; transition:opacity .45s, transform .45s;}
.say::after{content:""; position:absolute; bottom:-6px; left:16px; border:6px solid transparent; border-top-color:#8a6d1a; border-bottom:0;}
.say.out{opacity:0; transform:translateY(-9px);}
@keyframes sayIn{from{opacity:0; transform:translateY(9px) scale(.82);} to{opacity:1;}}
.phasetip{position:absolute; left:50%; top:-12px; transform:translateX(-50%); z-index:29; background:rgba(18,10,3,.88);
  border:1px solid #d6b25e; color:#ffe9a8; font-size:12px; padding:2px 12px; border-radius:999px; letter-spacing:3px;
  pointer-events:none; animation:phaseIn 1s ease forwards;}
@keyframes phaseIn{0%{opacity:0; transform:translate(-50%,7px);}16%{opacity:1; transform:translate(-50%,0);}72%{opacity:1;}100%{opacity:0;}}
.zone .tag{cursor:pointer;}
.zone .tag:hover{outline:1px solid #ffe9a8; filter:brightness(1.25);}
.seat .rowline.sk{cursor:pointer; text-decoration:underline dotted rgba(106,90,64,.6); text-underline-offset:3px;}
.seat .rowline.sk:hover{color:#8a5a00;}
.galTabs{display:flex; gap:8px; justify-content:center; margin-bottom:10px;}
.galTabs button.on{outline:2px solid #8a5a00; background:#6e4310; color:#ffe9a8;}
.galGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:9px; max-height:56vh; overflow:auto; text-align:left; padding:2px;}
.galOne{background:rgba(96,66,26,.12); border:1px solid rgba(122,85,32,.4); border-radius:10px; padding:9px;}
.galHead{display:flex; align-items:center; gap:9px; margin-bottom:4px;}
.galOne h4{margin:0; font-size:15px; color:#5a2d00;} .galOne .kg{font-size:11px; color:#6a5232;}
.galOne p{margin:4px 0; font-size:12px; color:#3f2f18; line-height:1.5;}
.galOne p b{color:#7a3c00;} .galOne .lines{color:#8a5a10; font-style:italic;}
.galRow{display:flex; align-items:center; gap:9px; padding:5px 4px; border-bottom:1px dashed rgba(122,85,32,.35); font-size:12.5px; color:#3f2f18;}
.galRow .nm{color:#5a2d00; font-weight:bold; min-width:92px;}
/* —— 主页 —— */
#home{position:fixed; inset:0; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:radial-gradient(1100px 640px at 50% 32%, #43301c 0%, #241a10 55%, #0d0906 100%);}
#home .hTitle{font-size:62px; font-weight:bold; letter-spacing:16px; color:#ffd76a; text-shadow:0 0 34px rgba(255,215,106,.5), 0 4px 0 #2b1d0c;}
#home .hSub{font-size:16px; letter-spacing:10px; color:#c8a85a; margin-top:-8px;}
#home .hCre{font-size:12px; color:#8d7a55; letter-spacing:3px; margin-bottom:8px;}
#home .hMain{font-size:21px; padding:13px 54px; letter-spacing:4px;}
#home .hRow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:560px;}
#home .hTip{font-size:12px; color:#8d7a55; letter-spacing:2px; margin-top:6px;}
/* —— 送花 / 砸鸡蛋 —— */
.flyemoji{position:absolute; z-index:36; font-size:26px; pointer-events:none; filter:drop-shadow(0 2px 5px rgba(0,0,0,.55));}
.react{position:absolute; z-index:37; font-size:30px; pointer-events:none;}
.splat{position:absolute; z-index:36; font-size:44px; pointer-events:none; animation:splatIn .3s ease-out; filter:drop-shadow(0 0 10px #ffd54a);}
.seat.blush{outline:3px solid #ff8fb3 !important; box-shadow:0 0 24px #ff8fb3 !important;}
.seat.egged{animation:shake .5s ease-in-out 2;}
@keyframes splatIn{0%{transform:scale(2.4); opacity:0;}100%{transform:scale(1); opacity:1;}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(6px);}60%{transform:translateX(-5px);}80%{transform:translateX(4px);}}
.drawback{position:absolute; z-index:8; width:54px; height:80px; border-radius:7px; border:2px solid #8a6d1a; box-shadow:0 4px 14px rgba(0,0,0,.5);
  background:repeating-linear-gradient(45deg,#6d4f26,#6d4f26 6px,#8a6534 6px,#8a6534 12px);}
/* 席位环绕互动菜单：点击其他武将直接在其周围弹出三选项 */
#seatMenu{position:absolute; z-index:38; display:flex; flex-direction:column; gap:5px; padding:8px;
  background:linear-gradient(var(--paper),var(--paper2)); border:2px solid var(--gold2); border-radius:10px; box-shadow:0 6px 22px rgba(0,0,0,.5);}
#seatMenu button{font-size:13px; padding:6px 12px; white-space:nowrap;}
</style>
</head>
<body>
<div id="home" class="hidden">
  <div class="hTitle">三国杀</div>
  <div class="hSub">· 风 林 火 山 ·</div>
  <div class="hCre">⚔ 30 武将 · 军争162牌堆 · 标准5人 / 军争8人 / 2v2团战 · 联机开黑 ⚔</div>
  <button class="hMain" onclick="homeSingle('id5')">⚔️ 标准5人局</button>
  <div class="hRow">
    <button onclick="homeSingle('id8')">🔥 军争8人局</button>
    <button onclick="homeSingle('dui')">🤝 2v2 团战（无身份）</button>
    <button onclick="homeNet()">🎮 组局开黑</button>
    <button onclick="openGallery()">📚 图鉴</button>
    <button id="sfxBtnHome" onclick="sfxToggle()">🔊 音效</button>
    <button onclick="showRules()">📜 玩法规则</button>
  </div>
  <div class="hTip">点装备/技能看介绍 · 送花砸鸡蛋互动 · ?room=房间码 一键加入联机</div>
</div>
<div id="app">
  <header>
    <h1>三国杀 · 风林火山</h1>
    <span class="info" id="phaseInfo"></span>
    <span class="sp"></span>
    <button onclick="openModeMenu()">🎮 组局开黑</button>
    <button onclick="openGallery()">📚 图鉴</button>
    <button id="sfxBtn" onclick="sfxToggle()">🔊 音效</button>
    <button onclick="showRules()">玩法规则</button>
    <button onclick="location.reload()">重新开局</button>
  </header>
  <div id="board">
    <svg id="fx"></svg>
    <div id="seats"></div>
    <div id="arena"><div class="table"><div class="deck" id="deckInfo"></div><div id="stage"></div></div></div>
    <div id="prompt"></div>
    <div id="human">
      <div id="humanInfo"></div>
      <div id="handWrap"></div>
      <div id="skills"></div>
    </div>
  </div>
  <div id="log"></div>
</div>
<div class="overlay hidden" id="modal"><div class="panel" id="modalPanel"></div></div>

<script>
"use strict";
/* =========================================================
 * 三国杀 · 单文件网页版
 * 结构：①数据(卡牌/武将) ②状态 ③通用工具 ④UI渲染 ⑤结算引擎
 *       ⑥AI ⑦回合流程 ⑧人类交互 ⑨启动
 * ========================================================= */

// ---------- 全局错误捕获（方便调试） ----------
window.onerror = function(msg, src, line){ addLog("⚠ 脚本错误: " + msg + " (行" + line + ")", "sys"); };
window.addEventListener("unhandledrejection", e=>{
  addLog("⚠ 结算异常: " + ((e.reason && e.reason.message) || e.reason), "sys");
});

// ---------- ① 数据 ----------
const RED = s => s === "♥" || s === "♦";

const GENERALS = {

let CARD_ID = 0;
function mkCard(name, suit, num, extra){
  const t = extra && extra.t ? extra.t :
    ({ "杀":"kill","火杀":"kill","雷杀":"kill","闪":"dodge","桃":"peach","酒":"wine","决斗":"duel","南蛮入侵":"tao","万箭齐发":"arrow",
       "顺手牵羊":"snatch","过河拆桥":"dismantle","乐不思蜀":"indulge","兵粮寸断":"supply","闪电":"lightning",
       "无中生有":"wuzhong","桃园结义":"oath","五谷丰登":"bountiful","铁索连环":"chain","火攻":"fireatk",
       "借刀杀人":"jiedao","水淹七军":"flood","无懈可击":"wuxie" }[name] || "basic");
  return Object.assign({id:++CARD_ID, n:name, s:suit, num:num, t:t}, extra||{});
}

let state = null;
let NET = null; // 联机传输层；null = 单机/AI模式（一切逻辑与单机完全一致）
function newState(){
  return {
    players:[], deck:shuffle(buildDeck()), discard:[], turn:0, cur:null,
    hostility:{}, over:false, ui:null, uid:0,
  };
}

// ---------- ③ 工具 ----------
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const SPEED = /fast/.test(location.search) ? 0.12 : 1;   // ?fast 加速（测试用）
const AUTO  = /auto/.test(location.search);              // ?auto 全自动托管（测试用）
const sleep = ms => new Promise(r=>setTimeout(r, Math.max(16, ms*SPEED)));
const STAGE_MS = 1800;  // 每张牌场中央驻留时长（1.8秒）
const P = id => state.players[id];
const alive = () => state.players.filter(p=>p.alive);
const aliveIds = () => state.players.filter(p=>p.alive).map(p=>p.id);
function hasSkill(p, s){ return p && p.gid && GENERALS[p.gid].skills.some(k=>k.n===s); }
function nextAlive(from){ const n=state.players.length; for(let i=1;i<=n;i++){ const q=P((from+i)%n); if(q.alive) return q; } return null; }
function nextAliveAfter(from){ /* 不含自己 */ const n=state.players.length; for(let i=1;i<n;i++){ const q=P((from+i)%n); if(q.alive) return q; } return null; }
function weapon(p){ return p.eq.weapon; }
function rangeOf(p){ return weapon(p) ? weapon(p).range : 1; }
function cardsOf(p){ return p.hand.length + (p.eq.weapon?1:0)+(p.eq.armor?1:0)+(p.eq.plus?1:0)+(p.eq.minus?1:0); }
function dist(a,b){ // a→b 的有效距离（含±1马）
  const list = aliveIds(); const ia=list.indexOf(a.id), ib=list.indexOf(b.id);
  let base = Math.min((ib-ia+list.length)%list.length, (ia-ib+list.length)%list.length);
  if(base===0) base = list.length===1 ? 99 : base; // 理论上不会取自己
  let d = base + (b.eq.plus?1:0) - (a.eq.minus?1:0);
  if(hasSkill(a,"马术")) d -= 1; // 庞德马术
  return Math.max(d, 0);
}
function draw(p,n){ const got=[]; for(let i=0;i<n;i++){
    if(!state.deck.length){ if(!state.discard.length) break;
      state.deck = shuffle(state.discard); state.discard=[]; addLog("牌堆已洗切重组","sys"); }
    const c = state.deck.pop(); p.hand.push(c); got.push(c); } return got; }
function toDiscard(card){ state.discard.push(card); }
function grabDiscard(card){ const i=state.discard.findIndex(c=>c.id===card.id); if(i>=0){ state.discard.splice(i,1); return card; } return null; }

// ---------- ③′ 音效（WebAudio 合成，无外部素材） ----------
const SFX = {
  ctx:null, master:null,
  on: (()=>{ try{ return localStorage.getItem("sgs_sfx")!=="0"; }catch(e){ return true; } })(),
  ensure(){ if(!this.ctx){ const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value=0.3; this.master.connect(this.ctx.destination); }
    if(this.ctx.state==="suspended") this.ctx.resume().catch(()=>{}); return this.ctx; },
  tone(f0,f1,dur,type,vol,delay){ const c=this.ensure(); if(!c) return; const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(), g=c.createGain(); o.type=type||"sine";
    o.frequency.setValueAtTime(f0,t0); if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.22,t0+0.014); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+0.06); },
  noise(dur,vol,fc,delay,q){ const c=this.ensure(); if(!c) return; const t0=c.currentTime+(delay||0);
    const len=Math.max(1,(dur*c.sampleRate)|0); const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=c.createBufferSource(); src.buffer=buf; const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=fc||1200; f.Q.value=q||0.8;
    const g=c.createGain(); g.gain.value=vol||0.3; src.connect(f); f.connect(g); g.connect(this.master); src.start(t0); },
  play(n){ if(!this.on) return; try{ const f=this["_"+n]; if(f) f.call(this); }catch(e){} },
};
SFX._use    = function(){ this.noise(0.09,0.34,2600,0,1.2); this.tone(660,990,0.07,"square",0.05,0.02); };
SFX._flick  = function(){ this.noise(0.07,0.2,1500); };
SFX._dodge  = function(){ this.tone(1240,1860,0.16,"sine",0.26); this.tone(1860,2480,0.12,"sine",0.14,0.05); };
SFX._hurt   = function(){ this.noise(0.2,0.5,300,0,0.6); this.tone(180,64,0.22,"sawtooth",0.36,0.01); };
SFX._heal   = function(){ this.tone(520,780,0.14,"sine",0.22); this.tone(660,990,0.15,"sine",0.2,0.09); this.tone(780,1170,0.2,"sine",0.17,0.18); };
SFX._skill  = function(){ this.tone(880,880,0.07,"triangle",0.18); this.tone(1170,1170,0.07,"triangle",0.18,0.07); this.tone(1560,1560,0.11,"triangle",0.15,0.14); };
SFX._phase  = function(){ this.tone(392,392,0.09,"sine",0.11); };
SFX._line   = function(){ this.noise(0.05,0.16,2000); this.tone(980,740,0.12,"triangle",0.14,0.04); };
SFX._jud    = function(){ this.tone(1400,900,0.06,"square",0.1); };
SFX._die    = function(){ this.tone(220,55,0.7,"sawtooth",0.3); this.noise(0.5,0.26,220,0.05,0.5); };
SFX._win    = function(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,f,0.16,"triangle",0.22,i*0.12)); };
SFX._lose   = function(){ [392,330,262,196].forEach((f,i)=>this.tone(f,f*0.96,0.2,"triangle",0.2,i*0.16)); };

function sayBubble(p, txt){
  if(!p || !txt || !state) return;
  const host = document.getElementById("seat"+p.id) || (me()===p ? document.getElementById("humanInfo") : null);
  const board = document.getElementById("board");
  if(!host || !board || board.querySelector(`.say[data-seat="${p.id}"]`)) return;
  const b = document.createElement("div"); b.className="say"; b.dataset.seat=p.id; b.textContent="「"+txt+"」";
  const br=board.getBoundingClientRect(), hr=host.getBoundingClientRect();
  b.style.left = Math.max(8, Math.min(br.width-150, hr.right-br.left-125))+"px";
  b.style.top  = Math.max(2, hr.top-br.top-8)+"px";
  board.appendChild(b); SFX.play("line");
  setTimeout(()=>{ b.classList.add("out"); setTimeout(()=>b.remove(),520); }, Math.max(900,1700*SPEED));
}
function phaseTip(p, name){ // 阶段推进提示（挂在 #board 上，render 重绘不消失）
  if(!state || state.over || !p || !p.alive) return;
  const host = document.getElementById("seat"+p.id) || document.getElementById("humanInfo");
  const board = document.getElementById("board"); if(!host || !board) return;
  const el=document.createElement("div"); el.className="phasetip"; el.textContent=name;
  const br=board.getBoundingClientRect(), hr=host.getBoundingClientRect();
  el.style.left = (hr.left-br.left+hr.width/2)+"px";
  el.style.top  = Math.max(2, hr.top-br.top-14)+"px";
  board.appendChild(el); SFX.play("phase");

}

function flyFrom(el, fromP, dur){ // 元素从 fromP 座位飞到当前位置（无座位则原地放大）

function flyEmojis(from, to, chars, n, dur, done){
  const board=document.getElementById("board"); if(!board){ done&&done(); return; }

  if(!b){ done&&done(); return; }

  const x0=ar.left+ar.width/2-br.left-13, y0=ar.top+ar.height/2-br.top-13;
  const x1=brr.left+brr.width/2-br.left, y1=brr.top+brr.height/2-br.top-10;
  let cnt=0;
  for(let i=0;i<n;i++){
    const e=document.createElement("div"); e.className="flyemoji"; e.textContent=chars[i%chars.length]; board.appendChild(e);
    const sx=x0+(Math.random()*30-15), sy=y0+(Math.random()*20-10);
    const ex=x1+(Math.random()*50-25), ey=y1+(Math.random()*44-16);
    e.style.left=sx+"px"; e.style.top=sy+"px";
    const mid=(sy+ey)/2-70-Math.random()*40;
    if(e.animate) e.animate([

      {transform:`translate(${(ex-sx)*.5}px,${mid}px) rotate(${(Math.random()*140-70)|0}deg) scale(1.25)`,opacity:1,offset:.55},
      {transform:`translate(${ex-sx}px,${ey-sy}px) rotate(0deg) scale(.9)`,opacity:1}],

// —— 目标指向光束：使用者座位 → 目标座位画流动箭头，目标座位红闪 ——
function fxLink(a, b, color, fxStyle){
  if(!state || !a) return;
  const svg = document.getElementById("fx"), board = document.getElementById("board");
  if(!svg || !board) return;
  const list = (Array.isArray(b)?b:[b]).filter(t=>t && t!==a);
  if(!list.length) return;
  const br = board.getBoundingClientRect();
  const ar = document.getElementById("seat"+a.id) && document.getElementById("seat"+a.id).getBoundingClientRect();
  const g = document.createElementNS("http://www.w3.org/2000/svg","g");
  for(const t of list){
    const tel = document.getElementById("seat"+t.id); if(!tel) continue;
    const tr = tel.getBoundingClientRect();
    const c = color || "#ffd76a";
    if(ar){
      const x1=ar.left+ar.width/2-br.left, y1=ar.top+ar.height/2-br.top, x2=tr.left+tr.width/2-br.left, y2=tr.top+tr.height/2-br.top;
      const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, px=-uy, py=ux;
      const ax=x1+ux*54, ay=y1+uy*54, bx=x2-ux*60, by=y2-uy*60;
      g.insertAdjacentHTML("beforeend",
        `<line class="fxline" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${c}"/>` +
        `<polygon class="fxhead" points="${bx+ux*15},${by+uy*15} ${bx+px*8},${by+py*8} ${bx-px*8},${by-py*8}" fill="${c}"/>`);
    }
    g.insertAdjacentHTML("beforeend", `<circle class="fxring" cx="${tr.left+tr.width/2-br.left}" cy="${tr.top+tr.height/2-br.top}" r="36" stroke="${c}"/>`);
    const cls = fxStyle || "fxhit";
    tel.classList.add(cls); setTimeout(()=>tel.classList.remove(cls), 1600);
  }
  svg.appendChild(g); setTimeout(()=>g.remove(), 1700);
}

  const box = document.getElementById("prompt"); const ui = state.ui;
  const info = document.getElementById("phaseInfo");
  if(state.over){ box.innerHTML = ""; info.textContent=""; return; }
  if(ui && ui.mode==="target"){
    box.innerHTML = `${ui.msg} <button onclick="cancelUI()">取消</button>`;
    info.textContent = "选择目标中…"; return;
  }
  if(ui && ui.mode==="pick"){
    const need = ui.need ? `（需选 ${ui.need} 张，已选 ${ui.sel.size}）` : `（已选 ${ui.sel.size} 张）`;
    box.innerHTML = `${ui.msg}${need}
      <button onclick="confirmPick()" ${ui.sel.size < (ui.need||1)?"disabled":""}>${ui.confirmLabel||"确定"}</button>
      ${ui.noCancel ? "" : '<button onclick="cancelUI()">取消</button>'}`;
    if(AUTO && !window._autoPickT){
      window._autoPickT = setTimeout(()=>{ window._autoPickT=null;
        if(!(state.ui && state.ui.mode==="pick")) return;
        const ids=[...(state.ui.sel||[])];
        while(ids.length < (state.ui.need||1)){ const c=me().hand.find(c=>!ids.includes(c.id)); if(!c)break; ids.push(c.id); }
        state.ui.sel = new Set(ids); confirmPick();
      }, 160);
    }
    info.textContent = "选择手牌中…"; return;
  }
  const curP = state.cur || null;
  const chip = curP ? `<span class="turnchip">${avatarHTML(curP.gid,"sm")}<span class="tname">${gname(curP)} 的回合</span></span>` : "";
  if(state.cur===me() && me().alive){ box.innerHTML = chip+"你的出牌阶段：点手牌使用，或结束出牌。"; info.textContent="你的回合"; }
  else if(curP){ box.innerHTML = chip+`正在等待 ${gname(curP)} 行动…`; info.textContent = "对方回合"; }
  else { box.innerHTML = ""; info.textContent=""; }
}

// 通用弹窗（返回 Promise，resolve 选项下标；或 {card}；pic=gid 显示行动者头像）
function askModal(title, sub, labels, cards, pic){
  return new Promise(res=>{
    const m = document.getElementById("modal"), panel = document.getElementById("modalPanel");
    let html = `${pic?`<div class="modpic">${avatarHTML(pic,"big")}</div>`:""}<h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:""}`;
    if(cards && cards.length){
      html += `<div class="cards">` + cards.map((c,i)=>cardHTML(c,{onclick:`_modalPick(${i})`})).join("") + `</div>`;
      window._modalCards = cards;
    }
    html += `<div class="btns">` + (labels||[]).map((l,i)=>`<button onclick="_modalPick('opt${i}')">${l}</button>`).join("") + `</div>`;
    panel.innerHTML = html; m.classList.remove("hidden"); window._modalOpen = true;
    window._modalPick = v=>{ m.classList.add("hidden"); window._modalOpen=false; res(v); };
    if(AUTO) setTimeout(()=>{ if(window._modalOpen) window._modalPick("opt0"); }, 120);
  });
}
// 交互提示路由：本地玩家 → 本地弹窗；远程真人 → 网络往返（AI 不会走到这里）
async function askP(p, title, sub, labels, pic){
  if(NET && NET.host && p.ctrl==="remote") return await NET.req(p.id, {kind:"opts", title, sub, labels});
  return await askModal(title, sub, labels, null, pic);
}

// ---------- ⑤ 结算引擎 ----------
function canKillMore(p){ return hasSkill(p,"咆哮") || (weapon(p)&&weapon(p).eff==="crossbow") ? true : p.f.kills < 1; }
function killTargets(p){ // 可以成为 p 的【杀】目标的角色（马岱觊延：出牌阶段首杀无距离限制）
  const first = hasSkill(p,"觊延") && !p.f.jiUsed;
  return alive().filter(t=>t!==p && !isMate(p,t) && (first || dist(p,t)<=rangeOf(p)) && !(hasSkill(t,"空城") && t.hand.length===0));
}
function killAttr(p, card){ // 杀的火焰/雷电属性（朱雀羽扇将普通杀化火）
  if(card.n==="火杀") return "fire";
  if(card.n==="雷杀") return "thunder";
  if(card.n==="杀" && weapon(p) && weapon(p).eff==="zhuque") return "fire";
  return null;
}
function killOk(p, card, t){ // 于禁毅重 / 仁王盾：黑色杀无效；藤甲：无火焰属性的杀无效
  if(hasSkill(t,"毅重") && !RED(card.s)) return false;
  if(t.eq.armor && t.eq.armor.eff==="renwang" && !RED(card.s)) return false;
  if(hasArmor(t,"tengjia") && killAttr(p,card)!=="fire") return false;
  return true;
}
function trick1Targets(p, ignoreDist, isSnatch){ // 顺手/拆（拆无距离限制；谦逊挡顺手）
  return alive().filter(t=>t!==p && !isMate(p,t) && (ignoreDist || dist(p,t)<=1) && cardsOf(t)>0 && !(isSnatch && hasSkill(t,"谦逊")));
}
function delayTargets(p){ return alive().filter(t=>t!==p && !isMate(p,t) && t.judge.length===0 && !hasSkill(t,"谦逊")); }

// —— 模式辅助：state.mode="id" 身份战（标准5人/军争8人）；"dui" 2v2无身份团战（蓝队1·3位 vs 红队2·4位） ——
function ISDUI(){ return !!state && state.mode==="dui"; }
function isMate(a,b){ return ISDUI() && a.team===b.team; }
function foes(p){ return alive().filter(t=>t!==p && !isMate(p,t)); }
function teamName(p){ return p.team===0?"蓝":"红"; }

// —— 出【闪】判定（true=已闪） ——
async function askDodge(t, viaCard, attacker, needIn){
  if(viaCard && viaCard.noDodge) { addLog(`${gname(t)} 的【闪】被封锁，无法响应`,"judge"); return false; } // 青釭剑/觊延
  const need = needIn || ((attacker && hasSkill(attacker,"无双")) ? 2 : 1); // 吕布无双：需两张闪
  const dtag = c => c.n==="闪" ? "" : (hasSkill(t,"龙胆")&&c.n==="杀" ? "·龙胆" : hasSkill(t,"倾国")&&c.t!=="eq"&&!RED(c.s) ? "·倾国" : hasSkill(t,"急救")&&c.n==="桃" ? "·急救" : "");
  if(t.ai){
    let got = 0;
    if(hasArmor(t,"bagua") && Math.random()<0.5){ got++; addLog(`${gname(t)} 的【八卦阵】判定成功，视为打出【闪】`,"skill"); }
    while(got < need){
      const pool = dodgeOptions(t);
      if(!pool.length) break;
      if(Math.random() >= (t.hp<=2 ? 0.93 : 0.8)) break;
      const d = pool[0]; useCardFrom(t, d); toDiscard(d);
      addLog(`${gname(t)} 打出【${d.n}】${dtag(d)}响应【杀】`);
      await stageShow(t, d, `${gname(t)} 打出【${d.n}】${dtag(d)}响应【杀】`, STAGE_MS, attacker, "#7ec8ff", "fxhit2");
      got++;
    }
    if(got>=need && need>1) addLog(`${gname(t)} 连出两张【闪】，抵消了无双之杀`);
    return got>=need;
  }
  let got = 0, baguaUsed = false;
  while(got < need){
    const dodges = dodgeOptions(t);
    const labels = []; const acts = [];
    if(hasArmor(t,"bagua") && !baguaUsed){ labels.push("发动【八卦阵】（判定♥即闪）"); acts.push("bagua"); }
    dodges.forEach(c=>{ labels.push(`打出手牌【${c.n}】(${c.s}${numName(c.num)})${dtag(c)}`); acts.push(c); });
    if(!labels.length) break;
    labels.push(got>0 ? "到此为止（还差闪就挨刀）" : "不出【闪】"); acts.push(null);
    let sub = attacker?`${gname(attacker)} 对 ${gname(t)} 使用了【杀】`:"";
    if(need>1) sub += `<br><b style="color:#a33">【无双】：需要 ${need} 张【闪】才能抵消（已出 ${got}/${need}）</b>`;
    const v = await askP(t, "【杀】向你袭来！", sub, labels, attacker?attacker.gid:null);
    const a = acts[+String(v).replace("opt","")];
    if(a==="bagua"){ baguaUsed=true;
      if(judge(t,"八卦阵")){ addLog(`${gname(t)} 的【八卦阵】判定成功，视为打出【闪】`,"skill"); got++; }
      else addLog(`${gname(t)} 的【八卦阵】判定失败`,"judge");
      continue; }
    if(a){ useCardFrom(t, a); toDiscard(a); addLog(`${gname(t)} 打出【${a.n}】${dtag(a)}响应【杀】`);
      await stageShow(t, a, `${gname(t)} 打出【${a.n}】${dtag(a)}响应【杀】`, STAGE_MS, attacker, "#7ec8ff", "fxhit2"); got++; continue; }
    break;
  }
  if(got>=need && need>1) addLog(`${gname(t)} 连出两张【闪】，抵消了无双之杀`);
  return got>=need;
}
function dodgeOptions(t){ // 可当闪打出的牌（龙胆：杀当闪；倾国：黑色手牌；急救：桃——回合外天然成立）
  const opts = t.hand.filter(c=>c.n==="闪");
  if(hasSkill(t,"龙胆")) opts.push(...t.hand.filter(c=>c.n==="杀"));
  if(hasSkill(t,"倾国")) opts.push(...t.hand.filter(c=>c.t!=="eq" && !RED(c.s) && c.n!=="闪"));
  if(hasSkill(t,"急救")) opts.push(...t.hand.filter(c=>c.n==="桃"));
  return opts;
}
function hasArmor(t, eff){ return t.eq.armor && t.eq.armor.eff===eff; }
function judge(p, name){ // 判定并记录（判定牌入弃牌堆），返回是否♥
  const c = drawTopJudge();
  addLog(`【${name}】判定牌：${c.s}${numName(c.num)} ${RED(c.s)?"（红）":"（黑）"}`,"judge");
  state.discard.push(c);
  return c.s==="♥";
}
function drawTopJudge(){ if(!state.deck.length){ state.deck=shuffle(state.discard); state.discard=[]; } return state.deck.pop(); }

function useCardFrom(p, card){ // 从手牌移除（进入弃牌堆由调用方决定）
  const i = p.hand.findIndex(c=>c.id===card.id); if(i>=0){ p.hand.splice(i,1); checkLianYing(p); }
}
function checkLianYing(p){ // 陆逊连营：失去最后的手牌后摸一张
  if(p && p.alive && state && state.cur && !state.over && p.hand.length===0 && hasSkill(p,"连营")){
    const g = draw(p,1); if(g.length) addLog(`${gname(p)}【连营】：手牌已空，摸一张牌`,"skill");
  }
}
function gname(p){ // 单机：(你)；联机：房主自己标(房主)，其他真人用昵称（日志文本由房主渲染，须用中立称谓）
  const G = GENERALS[p.gid].name;
  if(NET && NET.host) return G + (p.id===0 ? "(房主)" : (p.pname ? `(${p.pname})` : ""));
  return G + (p.isHuman ? "(你)" : (NET && p.pname ? `(${p.pname})` : ""));
}

// —— 使用【杀】 ——
async function useKill(p, t, card, asPeachless){
  if(t.eq.armor && t.eq.armor.eff==="renwang" && !RED(card.s)){ // 仁王盾兜底
    useCardFrom(p, card);
    addLog(`${gname(t)} 的【仁王盾】：黑色【杀】无效！`,"skill");
    toDiscard(card); render(); await stageShow(p, card, `${gname(p)} 的【杀】被【仁王盾】挡下`, STAGE_MS, t, "#a9cce3"); return;
  }
  const attr = killAttr(p, card);
  if(hasArmor(t,"tengjia") && attr!=="fire"){ // 藤甲兜底：非火焰杀无效
    useCardFrom(p, card);
    addLog(`${gname(t)} 的【藤甲】：非火焰【杀】无效！`,"skill");
    toDiscard(card); render(); await stageShow(p, card, `${gname(p)} 的【杀】被【藤甲】挡下`, STAGE_MS, t, "#a3b18a"); return;
  }
  if(attr==="fire" && card.n==="杀") addLog(`${gname(p)} 的【朱雀羽扇】：此【杀】化作烈焰！`,"skill");
  if(attr==="fire" && card.n==="火杀") addLog(`${gname(p)} 祭出【火杀】，火借风势！`,"skill");
  if(attr==="thunder") addLog(`${gname(p)} 祭出【雷杀】，雷光绕刃！`,"skill");
  useCardFrom(p, card);
  p.f.kills++;
  if(p.f.drunk){ p.f.drunk=false; p.f.wineNext=true; addLog(`${gname(p)} 的酒意渗入刀锋——这张【杀】伤害+1`,"skill"); }
  const kName = (card.virt||card.n==="杀") ? "杀" : card.n; // 火杀/雷杀显示本名
  addLog(`${gname(p)} 对 ${gname(t)} 使用【${kName}】${card.asIf&&!card.virt?`（发动【${card.asIf}】，原牌【${card.n}】）`:""}${card.virt?`（【${card.n}】）`:""}`);
  render();
  await stageShow(p, card, card.virt?`${gname(p)} 发动【${card.n}】→ ${gname(t)}`:`${gname(p)} 出【${kName}】→ ${gname(t)}`, STAGE_MS, t);
  let dmg = 1;
  let guard = 0;
  let first = true;
  let xuDone = false;
  let noDodge = (weapon(p) && weapon(p).eff==="qinggang") || !!card.noDodge;
  // 马岱觊延：出牌阶段第一张杀无距离限制且不可响应
  if(hasSkill(p,"觊延") && !p.f.jiUsed && !card.virt){
    p.f.jiUsed = true; noDodge = true;
    addLog(`${gname(p)}【觊延】：此【杀】无视距离且不可被【闪】响应！`,"skill");
  }
  while(guard++ < 3){
    let need = hasSkill(p,"无双") ? 2 : 1;
    // 徐晃截粮：首刀判定，黑色则需两张闪
    if(first && !xuDone && hasSkill(p,"截粮") && !noDodge && need<2){
      xuDone = true;
      const c = drawTopJudge(); const black = !RED(c.s); judgeShow(c);
      if(black){ need = 2; addLog(`${gname(p)}【截粮】判定为黑——此【杀】需两张【闪】抵消！`,"judge"); }
    }
    const dodged = await askDodge(t, {noDodge}, p, need);
    if(!dodged){ break; }
    // 庞德猛进：杀被闪抵消后可弃置目标一张牌
    if(hasSkill(p,"猛进") && cardsOf(t)>0 && !state.over){
      let yes = p.ai ? true : (await askP(p, "猛进", "你的【杀】被闪避，可弃置其一张牌。", ["弃他的牌","算了"])==="opt0");
      if(yes){
        const eqs = ["weapon","armor","plus","minus"].map(s=>t.eq[s]).filter(Boolean);
        if(eqs.length){ const c=eqs[0]; t.eq[c.slot]=null; toDiscard(c); addLog(`${gname(p)}【猛进】弃掉了 ${gname(t)} 的【${c.n}】`,"skill"); equipLost(t,c); }
        else if(t.hand.length){ const c=t.hand.splice(Math.floor(Math.random()*t.hand.length),1)[0]; toDiscard(c); checkLianYing(t); addLog(`${gname(p)}【猛进】弃掉了 ${gname(t)} 的手牌【${c.n}】`,"skill"); }
        render();
      }
    }
    // 武器：被闪后的特效
    const w = weapon(p);
    if(w && w.eff==="zhangba" && first){
      const got = popDodgeFromDiscard(t);
      if(got){ p.hand.push(got); addLog(`${gname(p)} 的【丈八蛇矛】：获得了那张【闪】`,"skill"); }
    }
    if(w && w.eff==="longhui"){ const g=draw(p,1); if(g.length) addLog(`${gname(p)} 的【龙挥刀】：挥空反趁势摸一张牌`,"skill"); }
    if(w && w.eff==="greendragon"){
      const want = p.ai ? t.hand.length < 3 : null;
      let yes = p.ai ? want : await useGreenDragon(p, t);
      if(yes){ addLog(`${gname(p)} 发动【青龙偃月刀】，将此【闪】当【杀】继续追击！`,"skill"); first=false; render(); await sleep(300); continue; }
    }
    // 贯石斧：杀被闪抵消时可弃两张牌强中
    if(w && w.eff==="guanshi" && p.alive && cardsOf(p)>=2 && !state.over){
      const yes = p.ai ? threatScore(p,t)>2 : (await askP(p,"贯石斧","【杀】被闪开：弃两张牌，令此【杀】强行命中？",["贯石裂甲，强中！","算了"])==="opt0");
      if(yes){
        for(let k2=0;k2<2;k2++){
          if(p.hand.length){ const cc=p.hand.shift(); toDiscard(cc); checkLianYing(p); }
          else { const eqs2=["weapon","plus","minus"].map(s2=>p.eq[s2]).filter(Boolean); if(eqs2.length){ const cc=eqs2[0]; p.eq[cc.slot]=null; toDiscard(cc); equipLost(p,cc); } }
        }
        addLog(`${gname(p)} 的【贯石斧】：力劈华山，一斧贯石，强袭命中！`,"skill");
        render(); await sleep(240); break;
      }
    }
    // 雌雄双股剑：异性被杀闪开后，弃两张手牌或让攻击者摸两张
    if(w && w.eff==="cixiong" && isFem(p)!==isFem(t) && !state.over){
      if(t.ai){
        if(t.hand.length>=2){ const c1=t.hand.splice((Math.random()*t.hand.length)|0,1)[0]; const c2=t.hand.splice((Math.random()*t.hand.length)|0,1)[0];
          toDiscard(c1); toDiscard(c2); checkLianYing(t); addLog(`${gname(t)} 抵不住【雌雄双股剑】：弃两张手牌`,"skill"); }
        else{ const g=draw(p,2); addLog(`${gname(t)} 抵不住【雌雄双股剑】：${gname(p)} 摸${g.length}张牌`,"skill"); }
      } else {
        const v = await askP(t,"雌雄双股剑",`${gname(p)} 的剑嗡鸣不已：弃两张手牌，或让 ${gname(p)} 摸两张牌。`,["弃两张手牌","任其摸两张"]);
        if(v==="opt0" && t.hand.length>=2){ const c1=t.hand.splice((Math.random()*t.hand.length)|0,1)[0]; const c2=t.hand.splice((Math.random()*t.hand.length)|0,1)[0];
          toDiscard(c1); toDiscard(c2); checkLianYing(t); addLog(`${gname(t)} 弃两张手牌抵住雌雄剑`,"skill"); }
        else{ const g=draw(p,2); addLog(`${gname(t)} 让 ${gname(p)} 摸${g.length}张牌抵住雌雄剑`,"skill"); }
      }
      render();
    }
    p.f.wineNext = false;
    addLog(`${gname(t)} 闪避了【杀】`);
    if(!card.virt) toDiscard(card); render(); return;
  }
  if(p.f.wineNext){ dmg++; p.f.wineNext=false; }
  if(hasSkill(p,"铁骑") && cardsOf(t)===0){ dmg++; addLog(`${gname(p)}【铁骑】：${gname(t)} 身上无装备，此【杀】伤害+1！`,"skill"); }
  if(hasSkill(p,"裸衣") && p.f.luoyi){ dmg++; addLog(`${gname(p)}【裸衣】：此【杀】伤害+1！`,"skill"); }
  if(weapon(p) && weapon(p).eff==="guding" && t.hand.length===0){ dmg++; addLog(`${gname(p)} 的【古锭刀】：趁虚而入，直贯空门——伤害+1！`,"skill"); }
  if(!card.virt) toDiscard(card);
  const wh = weapon(p);
  if(wh && wh.eff==="hanbing" && !state.over && cardsOf(t)>0){
    const yes = p.ai ? cardsOf(t)>=2 : (await askP(p, "寒冰剑", "【杀】已命中：可防止伤害，改为弃置其两张牌。", ["寒冰破防！","就要伤害"])==="opt0");
    if(yes){ addLog(`${gname(p)} 的【寒冰剑】：寒气侵袭，目标不受伤害但装备尽失！`,"skill"); render(); await discardUpTo(p, t, 2, "寒冰剑"); render(); return; }
  }
  const hpB = t.hp;
  await damage(p, t, dmg, card.virt?null:card, attr);
  if((!t.alive || t.hp < hpB) && p.alive && !state.over){
    const w2 = weapon(p);
    if(w2 && w2.eff==="qilin" && t.alive && (t.eq.plus||t.eq.minus)){
      const yes3 = p.ai ? true : (await askP(p, "麒麟弓", "命中！可一箭射落其坐骑。", ["射落坐骑！","算了"])==="opt0");
      if(yes3){ const h2=t.eq.plus||t.eq.minus; t.eq[h2.slot]=null; toDiscard(h2); equipLost(t,h2);
        addLog(`${gname(p)} 的【麒麟弓】：一箭射落【${h2.n}】！`,"skill"); render(); }
    }
    if(w2 && w2.eff==="yinyue" && t.alive){
      const yesY = p.ai ? true : (await askP(p, "银月枪", "银光泼洒：命中后可摸一张牌，然后弃置一张牌。", ["银月挥枪！","按兵不动"])==="opt0");
      if(yesY){ draw(p,1);
        addLog(`${gname(p)} 的【银月枪】：枪若银龙，摸一张牌！`,"skill"); render();
        if(p.hand.length){
          if(p.ai){ const cY=p.hand[(Math.random()*p.hand.length)|0]; p.hand.splice(p.hand.indexOf(cY),1); toDiscard(cY); checkLianYing(p);
            addLog(`${gname(p)}【银月枪】弃掉了【${cY.n}】`,"skill"); render(); }
          else { const idsY = await pickOwnCards(p, 1, "【银月枪】：弃置一张手牌", "弃置", true);
            const cY = p.hand.find(x=>x.id===(idsY&&idsY.length?idsY[0]:-1));
            if(cY){ p.hand.splice(p.hand.indexOf(cY),1); toDiscard(cY); checkLianYing(p);
              addLog(`${gname(p)}【银月枪】弃掉了【${cY.n}】`,"skill"); await stageShow(p,cY,`${gname(p)}【银月枪】弃掉了【${cY.n}】`); render(); } }
        }
      }
    }
  }
  // 张辽突袭：杀造成伤害后取其一张牌
  if(hasSkill(p,"突袭") && t.alive && cardsOf(t)>0 && !state.over){
    let yes = true;
    if(!p.ai) yes = (await askP(p, "突袭", "你可以获得目标的一张牌。", ["拿来吧！","算了"])==="opt0");
    if(yes){ tuxiTake(p, t); render(); }
  }
  // 方天画戟：以最后的手牌作【杀】时，额外横扫至多两名攻击范围内角色
  const wq = weapon(p);
  if(wq && wq.eff==="fangtian" && !card.virt && p.alive && !state.over && p.hand.length===0){
    const extra = killTargets(p).filter(x=>x!==t && killOk(p,card,x));
    for(const x of extra.slice(0,2)){
      if(state.over || !p.alive) break;
      addLog(`${gname(p)} 的【方天画戟】：画戟横扫，追加 ${gname(x)} 为目标！`,"skill");
      await useKill(p, x, {id:-(900+(state.uid++)), n:"杀", s:card.s, num:card.num, t:"kill", virt:true});
    }
  }
}
// 通用：弃置目标至多 n 张牌（装备优先，逐张上过场）——寒冰剑/三尖两刃刀等武器特效共用
async function discardUpTo(src, t, n, tag){
  for(let i=0;i<n;i++){
    if(!t.alive || state.over) break;
    let c = null, fromEq = false;
    const eqs = ["weapon","armor","plus","minus"].map(s=>t.eq[s]).filter(Boolean);
    if(eqs.length){ c = eqs[(Math.random()*eqs.length)|0]; t.eq[c.slot]=null; fromEq = true; }
    else if(t.hand.length){ c = t.hand.splice(Math.floor(Math.random()*t.hand.length),1)[0]; checkLianYing(t); }
    if(!c) break;
    toDiscard(c);
    addLog(`${gname(src)}【${tag}】弃掉了 ${gname(t)} 的【${c.n}】`,"skill");
    if(fromEq) equipLost(t,c);
    render(); await stageShow(src, c, `${gname(src)}【${tag}】弃掉了【${c.n}】`);
  }
}
// 装备区的牌离开装备区：枭姬摸两张；白银狮子离开回复1点体力
function equipLost(p, card){
  if(!p || !p.alive || !state || state.over) return;
  if(hasSkill(p,"枭姬")){ const g = draw(p,2); if(g.length) addLog(`${gname(p)}【枭姬】：失去装备，摸${g.length}张牌`,"skill"); }
  if(card && card.eff==="baiyin" && p.hp>0 && p.hp<p.maxHp){
    p.hp++; fxLink(p,p,"#7dcea0","fxhitg");
    addLog(`${gname(p)} 的【白银狮子】：宝甲归隐，回复1点体力`,"heal"); render();
  }
}
function tuxiTake(p, t){ // 突袭：优先拿装备，其次随机手牌
  const eqs = ["weapon","armor","plus","minus"].map(s=>t.eq[s]).filter(Boolean);
  let got = null;
  if(eqs.length){ const c=eqs[0]; t.eq[c.slot]=null; got=c; equipLost(t,c); }
  else if(t.hand.length){ got = t.hand.splice(Math.floor(Math.random()*t.hand.length),1)[0]; }
  if(got){ p.hand.push(got); addLog(`${gname(p)}【突袭】抢走了 ${gname(t)} 的【${got.n}】`,"skill"); checkLianYing(t); fxLink(p, t); }
}
async function useGreenDragon(p, t){
  const v = await askP(p, "青龙偃月刀", "你的【杀】被闪开了。要将这张【闪】当【杀】继续使用吗？", ["继续追击","算了"]);
  return v === "opt0";
}
function popDodgeFromDiscard(t){ // 取最近进入弃牌堆、由 t 打出的闪（简化：找最近的闪）
  for(let i=state.discard.length-1;i>=0;i--){ if(state.discard[i].n==="闪"){ return state.discard.splice(i,1)[0]; } }
  return null;
}

// —— 决斗（card.virt = 离间等虚拟决斗，不入/出弃牌堆） ——
async function useDuel(p, t, card){
  useCardFrom(p, card);
  if(!card.virt && await tryWuxie(t, p, card)){ toDiscard(card); render(); return; }
  addLog(`${gname(p)} ${card.virt?`发动【离间】，令 ${gname(t)} 陷入【决斗】`:`对 ${gname(t)} 使用【决斗】`}`); render();
  await stageShow(p, card, `${gname(p)} 发起【决斗】→ ${gname(t)}`, STAGE_MS, t);
  let cur = t, other = p;
  let guard = 0;
  while(guard++ < 20 && !state.over){
    const needK = hasSkill(other,"无双") ? 2 : 1; // 对手是吕布：每回合需连出两张杀
    if(cur.ai){
      const safe = killOptions(cur, true).filter(c=>c.n!=="桃" && c.n!=="闪");
      if(safe.length>=needK && (cur.hp>=2 || other.hp<=1)){
        for(let i=0;i<needK;i++){ const use=safe[i]; useCardFrom(cur,use); toDiscard(use);
          addLog(`${gname(cur)} 打出【${use.n}】${use.asIf?`（${use.asIf}）`:""}`);
          await stageShow(cur, use, `${gname(cur)} 决斗出【杀】${needK>1?`（${i+1}/${needK}）`:""}`, STAGE_MS, other, "#7ec8ff", "fxhit2"); }
        [cur,other]=[other,cur]; continue;
      }
    } else {
      let ok = true;
      for(let i=0;i<needK;i++){
        const ks = killOptions(cur,true);
        const labels = ks.map(c=>`打出【${c.n}】(${c.s}${numName(c.num)})${c.asIf?`·${c.asIf}`:""}`);
        labels.push(needK>1 && i>0 ? "到此为止（还差杀就挨刀）" : "不出【杀】");
        if(!ks.length){ ok=false; break; }
        const v = await askP(cur, "决斗！", `${gname(cur)} 需要打出【杀】${needK>1?`（第 ${i+1}/${needK} 张——吕布的【无双】！）`:""}`, labels, other.gid);
        const idx = +String(v).replace("opt","");
        if(idx < ks.length){ const use=ks[idx]; useCardFrom(cur,use); toDiscard(use);
          addLog(`${gname(cur)} 打出【${use.n}】${use.asIf?`（${use.asIf}）`:""}`);
          await stageShow(cur, use, `${gname(cur)} 决斗出【杀】${needK>1?`（${i+1}/${needK}）`:""}`, STAGE_MS, other, "#7ec8ff", "fxhit2"); }
        else { ok=false; break; }
      }
      if(ok){ [cur,other]=[other,cur]; continue; }
    }
    if(!card.virt) toDiscard(card);
    addLog(`${gname(cur)} 决斗失败，受到伤害`,"dmg");
    const dmul = hasSkill(p,"裸衣") && p.f.luoyi ? 2 : 1; // 许褚裸衣：决斗伤害+1
    await damage(p, cur, dmul, card.virt?null:card); // 伤害来源是决斗发起者
    return;
  }
}
function killOptions(p, forDuel){ // 可当【杀】使用的牌（含火杀/雷杀；武圣/龙胆转化）
  const opts = p.hand.filter(c=>c.t==="kill").map(c=>Object.assign({},c,{asIf:null,real:true}));
  if(hasSkill(p,"武圣")) opts.push(...p.hand.filter(c=>c.t!=="eq" && c.t!=="kill" && RED(c.s) && (forDuel || c.n!=="桃" || p.ai===false) )
    .map(c=>Object.assign({},c,{asIf:"武圣"})));
  if(hasSkill(p,"龙胆")) opts.push(...p.hand.filter(c=>c.n==="闪").map(c=>Object.assign({},c,{asIf:"龙胆"})));
  return opts;
}

// —— 群体锦囊 ——
async function useAOE(p, card){
  useCardFrom(p, card);
  const kind = card.t; // tao / arrow
  const order = []; let q = nextAliveAfter(p.id);
  while(q && q.id!==p.id && q){ order.push(q); q = nextAliveAfter(q.id); if(order.length>7) break; }
  addLog(`${gname(p)} 使用了【${card.n}】`, "judge"); render();
  await stageShow(p, card, `${gname(p)} 释放【${card.n}】，全场响应`, STAGE_MS, order, kind==="arrow"?"#7ec8ff":"#ffb347");
  for(const t of order){
    if(state.over) return;
    if(kind==="arrow" && hasSkill(t,"空城") && t.hand.length===0){ addLog(`${gname(t)} 发动【空城】，不受【万箭齐发】影响`,"skill"); continue; }
    if(hasArmor(t,"tengjia")){ addLog(`${gname(t)} 的【藤甲】：不受【${card.n}】影响`,"skill"); continue; }
    if(await tryWuxie(t, p, card)) continue;
    if(kind==="tao"){
      const kills = killOptions(t, true).filter(c=>c.t==="kill"||c.asIf);
      let use=null;
      if(t.ai){ const safe=kills.filter(c=>c.n!=="桃"&&c.n!=="闪"); if(safe.length && (t.hp>=2 || safe.length>1)) use=safe[0]; }
      else{
        const labels = kills.map(c=>`打出【${c.n}】`); labels.push("不出（受1点伤害）");
        const v = await askP(t, "南蛮入侵！", `${gname(t)} 需要打出【杀】`, labels, p.gid);
        const idx = +String(v).replace("opt","");
        if(idx<kills.length) use = kills[idx];
      }
      if(use){ useCardFrom(t, use); toDiscard(use); addLog(`${gname(t)} 打出【${use.n}】`);
        await stageShow(t, use, `${gname(t)} 出【杀】抵御【南蛮入侵】`, STAGE_MS, p, "#7ec8ff", "fxhit2"); }
      else await damage(p, t, 1, card);
    }else{
      const dodged = await askDodge(t, {noDodge:false}, null);
      if(!dodged) await damage(p, t, 1, card);
      else addLog(`${gname(t)} 闪避了【万箭齐发】`);
    }
    if(state.over){ toDiscard(card); return; }
  }
  toDiscard(card); render();
}

// —— 无懈可击：锦囊生效前，目标可打出抵消（AI 自动决策；单机简化为单层抵消） ——
async function tryWuxie(tgt, src, card){
  if(state.over || !tgt || !tgt.alive || !tgt.hand) return false;
  const wx = tgt.hand.find(c=>c.n==="无懈可击");
  if(!wx) return false;
  let use = false;
  if(tgt.ai) use = Math.random()<0.45;
  else use = (await askP(tgt, "无懈可击！", `${gname(src)} 的【${card.n}】即将对 ${gname(tgt)} 生效，是否打出【无懈可击】抵消？`, ["无懈可击！","放弃"])) === "opt0";
  if(use){
    useCardFrom(tgt, wx); toDiscard(wx);
    addLog(`${gname(tgt)} 打出【无懈可击】，【${card.n}】的效果被抵消！`,"skill");
    render();
    await stageShow(tgt, wx, `${gname(tgt)} 无懈可击！【${card.n}】无效`, STAGE_MS, src, "#c39bd3");
    return true;
  }
  return false;
}
// —— 铁索连环 ——
async function useChain(p, t, card){
  useCardFrom(p, card);
  addLog(`${gname(p)} 对 ${gname(t)} 使用【铁索连环】`,"judge"); render();
  await stageShow(p, card, `${gname(p)} 【铁索连环】→ ${gname(t)}`, STAGE_MS, t, "#7fb3d5");
  if(await tryWuxie(t, p, card)){ toDiscard(card); render(); return; }
  if(t.chained){ t.chained=false; addLog(`${gname(t)} 的连环状态被重置`,"judge"); }
  else { t.chained=true; addLog(`${gname(t)} 进入连环状态 ⛓（属性伤害将沿链传导）`,"judge"); }
  toDiscard(card); render();
}
// —— 火攻 ——
async function useFireAttack(p, t, card){
  useCardFrom(p, card);
  addLog(`${gname(p)} 对 ${gname(t)} 使用【火攻】`,"judge"); render();
  await stageShow(p, card, `${gname(p)} 发动【火攻】→ ${gname(t)}`, STAGE_MS, t, "#ff9a57");
  if(await tryWuxie(t, p, card)){ toDiscard(card); render(); return; }
  if(!t.hand.length){ addLog(`${gname(t)} 手牌为空，火攻落空`,"judge"); toDiscard(card); render(); return; }
  const rc = t.hand[Math.floor(Math.random()*t.hand.length)];
  addLog(`${gname(t)} 展示一张手牌：${rc.s}${numName(rc.num)}【${rc.n}】`,"judge");
  await stageShow(t, rc, `${gname(t)} 展示【${rc.n}】`, 1000, p, "#ffd27f");
  const cands = p.hand.filter(c=>c.s===rc.s);
  let pick = null;
  if(!cands.length){ addLog(`${gname(p)} 没有 ${rc.s} 花色的手牌，火攻失效`,"judge"); }
  else if(p.ai){ pick = cands.filter(c=>!["桃","闪","杀","酒"].includes(c.n))[0] || cands[cands.length-1]; }
  else {
    const labels = cands.map(c=>`弃【${c.n}】(${c.s}${numName(c.num)})`); labels.push("放弃火攻");
    const v = await askP(p, "火攻", `弃一张 ${rc.s} 花色的手牌，即可令 ${gname(t)} 受到1点火焰伤害`, labels, t.gid);
    const idx = +String(v).replace("opt",""); if(idx < cands.length) pick = cands[idx];
  }
  if(pick && !state.over){
    useCardFrom(p, pick); toDiscard(pick);
    addLog(`${gname(p)} 弃【${pick.n}】引燃火攻！`,"skill");
    await stageShow(p, pick, `烈焰吞噬 ${gname(t)}`, 900, t, "#ff7f50");
    await damage(p, t, 1, null, "fire");
  }
  toDiscard(card); render();
}
// —— 借刀杀人 ——
async function useJiedao(p, t, card){
  useCardFrom(p, card);
  addLog(`${gname(p)} 对 ${gname(t)} 使用【借刀杀人】`,"judge"); render();
  await stageShow(p, card, `${gname(p)} 【借刀杀人】→ ${gname(t)}`, STAGE_MS, t, "#d7bde2");
  if(await tryWuxie(t, p, card)){ toDiscard(card); render(); return; }
  const cands = killTargets(t).filter(x=>x!==p || true);
  let v = null;
  if(cands.length){
    if(p.ai){ v = aiBestTargets(t, cands)[0] || cands[0]; }
    else {
      const tid = await pickTargetUI(p, cands.map(x=>x.id), `选择要求 ${gname(t)} 攻击的目标`);
      if(tid==null){ toDiscard(card); render(); return; }
      v = P(tid);
    }
  }
  let used = false;
  if(v && !state.over){
    const ks = killOptions(t, false).filter(c=>c.t==="kill"||c.asIf);
    if(ks.length){
      let ks1 = null;
      if(t.ai){ ks1 = ks.find(c=>c.t==="kill") || ks[0]; }
      else {
        const labels = ks.map(c=>`对${gname(v)}出【${c.n}】${c.asIf?`（${c.asIf}）`:""}`); labels.push("不出【杀】，刀给人");
        const an = await askP(t, "借刀杀人！", `${gname(p)} 逼你出【杀】斩向 ${gname(v)}——出刀保刀？`, labels, p.gid);
        const idx = +String(an).replace("opt",""); if(idx < ks.length) ks1 = ks[idx];
      }
      if(ks1){
        const real = syncCard(t, ks1);
        used = true;
        addLog(`${gname(t)} 刀光一闪，斩向 ${gname(v)}！`,"skill");
        await useKill(t, v, real);
        t.f.kills = Math.max(0, t.f.kills-1); // 借刀之杀不计次数
      }
    }
  }
  if(!used && !state.over && t.eq.weapon && t.alive){
    const w2 = t.eq.weapon; t.eq.weapon = null; equipLost(t, w2);
    p.hand.push(w2);
    addLog(`${gname(t)} 按兵不动——${gname(p)} 缴获了【${w2.n}】！`,"skill");
    await stageShow(p, w2, `${gname(p)} 缴获【${w2.n}】`, 1000, p, "#f7dc6f");
  }
  toDiscard(card); render();
}

async function useBountiful(p, card){
  useCardFrom(p, card);
  const n = alive().length; const pool = [];
  for(let i=0;i<n;i++){ if(!state.deck.length){ state.deck=shuffle(state.discard); state.discard=[]; } const c=state.deck.pop(); if(c) pool.push(c); }
  addLog(`${gname(p)} 使用【五谷丰登】，展示 ${pool.length} 张牌：${pool.map(c=>`【${c.n}】`).join("")}`,"judge");
  await stageShowMany(p, pool, `${gname(p)} 【五谷丰登】：开仓放粮，按行动顺序各取一张`);
  const VAL2 = {桃:6,闪:5,杀:4,火杀:4,雷杀:4,酒:4,顺手牵羊:3,过河拆桥:3,决斗:2.5,万箭齐发:3,南蛮入侵:2,无中生有:4.5,无懈可击:5,铁索连环:1.5,火攻:2.5};
  const orderList = [p]; let q2 = nextAliveAfter(p.id);
  while(q2 && q2.id!==p.id && orderList.length<8){ orderList.push(q2); q2 = nextAliveAfter(q2.id); }
  for(const one of orderList){
    if(!pool.length || state.over) break;
    let got = null;
    if(one.ai || one.ctrl==="remote"){
      pool.sort((a,b)=>(VAL2[b.n]||2)-(VAL2[a.n]||2)); got = pool.shift();
    } else {
      const v = await askModal(`五谷丰登：${gname(one)} 选一张`, "从展示的粮草中挑选", pool.map(c=>`${c.s}${numName(c.num)}【${c.n}】`));
      const idx = +String(v).replace("opt",""); got = pool.splice((isNaN(idx)||idx<0||idx>=pool.length)?0:idx, 1)[0];
    }
    if(got){ one.hand.push(got); checkLianYing(one); addLog(`${gname(one)} 取走【${got.n}】`,"judge"); render(); await sleep(220); }
  }
  toDiscard(card); render();
}

// —— 伤害 → 反应 → 濒死 ——
async function damage(src, tgt, amount, viaCard, attr, noChain){
  if(state.over || amount<=0 || !tgt) return;
  if(attr==="fire" && hasArmor(tgt,"tengjia")){ amount++; addLog(`${gname(tgt)} 的【藤甲】遇火即燃：火焰伤害+1！`,"skill"); }
  tgt.hp -= amount;
  flashSeat(tgt.id);
  if(src && src!==tgt) fxLink(src, tgt, "#ff6b57"); // 伤害来源 → 目标 红色光束
  addLog(`${gname(tgt)} 受到 ${amount} 点伤害${src?`（来源：${gname(src)}）`:""}`, "dmg");
  if(src && tgt.id!==src.id){ state.hostility[tgt.id] = state.hostility[tgt.id]||{}; state.hostility[tgt.id][src.id]=(state.hostility[tgt.id][src.id]||0)+amount; }
  render(); await sleep(320);
  // 魏延狂骨：对距离1以内角色造成伤害后回复1点
  if(src && src!==tgt && src.alive && hasSkill(src,"狂骨") && src.hp>0 && dist(src,tgt)<=1 && src.hp<src.maxHp && !state.over){
    src.hp++; fxLink(src, src, "#7dcea0", "fxhitg"); addLog(`${gname(src)}【狂骨】：回复1点体力`,"heal"); render();
  }
  // 遗计（郭嘉）
  if(tgt.alive && hasSkill(tgt,"遗计")){ const g=draw(tgt,3); addLog(`${gname(tgt)}【遗计】：受到伤害后摸${g.length}张牌`,"skill"); render(); }
  // 奸雄
  if(hasSkill(tgt,"奸雄") && viaCard){
    const got = grabDiscard(viaCard) || (src && src.hand.includes(viaCard)? src.hand.splice(src.hand.indexOf(viaCard),1)[0] : null);
    if(got){ tgt.hand.push(got); addLog(`${gname(tgt)} 发动【奸雄】，获得了【${got.n}】`,"skill"); render(); }
  }
  // 反馈
  if(hasSkill(tgt,"反馈") && src && src!==tgt && src.alive && cardsOf(src)>0){
    let yes = true;
    if(!tgt.ai) yes = (await askP(tgt, "反馈", "你可以弃置伤害来源的一张牌。", ["弃置之","放弃"], src.gid)==="opt0");
    if(yes){ await feedbackTake(tgt, src); render(); }
  }
  // 刚烈
  if(hasSkill(tgt,"刚烈") && viaCard && src && src!==tgt && src.alive){
    let yes = true;
    if(!tgt.ai) yes = (await askP(tgt, "刚烈", "你可以对伤害来源造成1点伤害。", ["弹他一下！","算了"], src.gid)==="opt0");
    if(yes){ addLog(`${gname(tgt)} 发动【刚烈】！`,"skill"); fxLink(tgt, src, "#ff6b57"); await damage(tgt, src, 1, null); }
  }
  // 恩怨（法正）
  if(tgt.alive && hasSkill(tgt,"恩怨") && src && src!==tgt && src.alive && !state.over){
    if(src.hand.length){
      const c = src.hand.splice(Math.floor(Math.random()*src.hand.length),1)[0];
      tgt.hand.push(c); checkLianYing(src);
      fxLink(src, tgt, "#a9cce3");
      addLog(`${gname(tgt)}【恩怨】：${gname(src)} 被迫交出一张【${c.n}】`,"skill"); render();
    }else{
      addLog(`${gname(tgt)}【恩怨】：${gname(src)} 无牌可交，失去1点体力`,"skill");
      src.hp--; flashSeat(src.id); render();
      if(src.hp<=0) await dying(src, null);
    }
  }
  // 铁索连环：属性伤害沿连环传导给其他连环角色
  if(attr && tgt.chained && !noChain && !state.over){
    const others = alive().filter(x=>x!==tgt && x.chained);
    if(others.length){
      addLog(`⛓ 铁索连环！${attr==="fire"?"火焰":"雷电"}伤害沿链传导！`,"judge");
      fxLink(tgt, others[0], attr==="fire"?"#ff9a57":"#85c1e9");
      for(const x of others){ if(state.over) break; await damage(src, x, amount, null, attr, true); }
    }
  }
  if(state.over) return;
  if(tgt.hp<=0) await dying(tgt, src);
}
