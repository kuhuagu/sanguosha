// —— 濒死 ——
async function dying(t, killer){
  addLog(`⚑ ${gname(t)} 处于濒死状态，需要【桃】！`, "death"); render();
  const n = state.players.length;
  for(let i=0;i<n;i++){
    const s = P((t.id+i)%n);
    if(state.over) return;
    if(!s.alive && s!==t) continue;
    const selfSave = (s===t);
    if(selfSave){
      const peaches = s.hand.filter(c=>c.n==="桃").length;
      const wines = s.hand.filter(c=>c.n==="酒" && !s.f.wineUsed).length;
      if(s.ai){
        if(peaches){ await peachUse(s, t, s.hand.find(c=>c.n==="桃")); return revive(t); }
        if(wines){ await wineSave(s, t); return revive(t); }
        continue;
      }
      const labels=[]; const acts=[];
      if(peaches){ labels.push("使用【桃】自救"); acts.push("peach"); }
      if(wines){ labels.push("使用【酒】自救"); acts.push("wine"); }
      if(labels.length){
        labels.push("放弃"); acts.push(null);
        const v = await askP(s, "你濒死了！", "可以用手牌自救", labels);
        const a = acts[+String(v).replace("opt","")];
        if(a==="peach"){ await peachUse(s,t,s.hand.find(c=>c.n==="桃")); return revive(t); }
        if(a==="wine"){ await wineSave(s,t); return revive(t); }
      }
    }else if(s.alive){
      const peach = s.hand.find(c=>c.n==="桃");
      if(!peach) continue;
      if(s.ai){
        const save = (s.role==="loyal" && t.role==="lord") || (t===s && false) ||
                     (Math.random()<0.25 && t.hand.length>2);
        if(save){ await peachUse(s,t,peach); return revive(t); }
        continue;
      }
      const v = await askP(s, `救援 ${gname(t)}`, `${gname(t)} 濒死。你持有【桃】，是否救他？`, ["桃救他","袖手旁观"], t.gid);
      if(v==="opt0"){ await peachUse(s,t,peach); return revive(t); }
    }
  }
  // 死亡
  await die(t, killer);
}
async function peachUse(s, t, peach){ useCardFrom(s, peach); toDiscard(peach); addLog(`${gname(s)} 对 ${gname(t)} 使用了【桃】`,"heal"); render(); await stageShow(s, peach, `${gname(s)} 用【桃】救 ${gname(t)}`, STAGE_MS, t, "#7dcea0", "fxhitg"); }
async function wineSave(s, t){ const c=s.hand.find(c=>c.n==="酒"); useCardFrom(s,c); toDiscard(c); s.f.wineUsed=true; addLog(`${gname(s)} 用【酒】救了自己`,"heal"); render(); await stageShow(s, c, `${gname(s)} 以【酒】自救`); }
function revive(t){ t.hp = 1; addLog(`${gname(t)} 被救回来了（体力1）`,"heal"); render(); return true; }

async function die(t, killer){
  t.alive = false; t.roleKnown = true;
  state.discard.push(...t.hand, ...["weapon","armor","plus","minus"].map(s=>t.eq[s]).filter(Boolean), ...t.judge);
  t.hand=[]; t.eq={weapon:null,armor:null,plus:null,minus:null}; t.judge=[];
  addLog(ISDUI()? `☠ ${gname(t)} 阵亡（${teamName(t)}队）`
                : `☠ ${gname(t)} 阵亡，身份是【${{lord:"主公",loyal:"忠臣",rebel:"反贼",minion:"内奸"}[t.role]}】`,"death");
  sayKind(t,"dying");
  if(killer && killer.alive){
    sayKind(killer,"kill");
    if(!ISDUI()){
      if(t.role==="rebel"){ draw(killer,3); addLog(`${gname(killer)} 斩杀反贼，摸3张牌`,"heal"); }
      if(killer.role==="lord" && t.role==="loyal"){ state.discard.push(...killer.hand); killer.hand=[]; addLog(`${gname(killer)} 误杀忠臣，弃光全部手牌！`,"dmg"); }
    }
  }
  render(); await sleep(500);
  checkWin();
}

function checkWin(){
  if(state.mode==="dui"){ // 2v2团战：灭对方全队即胜
    const t0 = state.players.filter(p=>p.team===0), t1 = state.players.filter(p=>p.team===1);
    if(t1.every(p=>!p.alive)) finish("team0","红队全员阵亡");
    else if(t0.every(p=>!p.alive)) finish("team1","蓝队全员阵亡");
    return;
  }
  const lord = state.players[state.lordId];
  const rebels = alive().filter(p=>p.role==="rebel");
  const minions = alive().filter(p=>p.role==="minion");
  if(!lord.alive){
    finish(rebels.length ? "rebel" : (minions.length ? "minion" : "rebel"), "主公阵亡");
  } else if(!rebels.length && !minions.length){
    finish("lord", "反贼与内奸全部覆灭");
  }
}
function finish(winRole, why){
  if(state.over) return;
  state.over = true; state.ui = null; state.win = winRole; state.why = why;
  const NAMES={lord:"主公与忠臣", rebel:"反贼", minion:"内奸", team0:"蓝队", team1:"红队"};
  const m0 = me() || state.players[0];
  const dui = state.mode==="dui";
  const humanWin = dui ? (m0.team === +winRole.slice(4))
    : NAMES[winRole].includes({lord:"主公",loyal:"忠臣",rebel:"反贼",minion:"内奸"}[m0.role]) ||
      (winRole==="lord" && (m0.role==="lord"||m0.role==="loyal"));
  if(!dui) state.players.forEach(p=>p.roleKnown=true); render();
  const reveal = state.players.map(p=>dui? `${GENERALS[p.gid].name}【${teamName(p)}队】${p.alive?"存活":"阵亡"}`
    : `${GENERALS[p.gid].name}【${{lord:"主公",loyal:"忠臣",rebel:"反贼",minion:"内奸"}[p.role]}】${p.alive?"存活":"阵亡"}`).join("　");
  const m=document.getElementById("modal"); document.getElementById("modalPanel").innerHTML =
    `<h2>${humanWin?"胜利":"败北"}</h2>
     <div class="sub">${why}——胜方：<b>${NAMES[winRole]}</b><br><br>${reveal}</div>
     <div class="btns"><button onclick="location.reload()">再来一局</button></div>`;
  m.classList.remove("hidden");
  SFX.play(humanWin?"win":"lose");
}

// ---------- ⑥ AI ----------
function threatScore(p, t){ // p 视角下 t 的威胁/敌意得分
  if(ISDUI()){ // 2v2团战：队友永不列为目标，敌人按仇恨/状态打分
    if(t.team===p.team) return -100;
    const H2 = (a,b)=> ((state.hostility[a]&&state.hostility[a][b])||0);
    let s2 = Math.random()*1.5 + H2(p.id,t.id)*2.5;
    if(t.hp<=2) s2 += 2;
    if(t.hand.length>=4 && t.hp>=t.maxHp) s2 += 1.5;
    if(t.eq.weapon||t.eq.armor) s2 += 0.8;
    return s2;
  }
  let s = Math.random()*1.5;
  const H = (a,b)=> ((state.hostility[a]&&state.hostility[a][b])||0);
  const lord = P(state.lordId);
  if(t.role==="rebel" && t.roleKnown) s += 6;                 // 亮明身份的反贼人人喊打
  if(p.role==="rebel" && t===lord) s += 8;                    // 反贼集火主公
  if(p.role==="lord" && H(lord.id, t.id)) s += H(lord.id, t.id)*2;
  if(p.role==="loyal") s += H(lord.id, t.id)*2.5;             // 忠臣痛打打主公的人
  if(p.role==="minion") s += Math.max(H(lord.id, t.id), H(p.id, t.id))*1.2 + (t.hand.length>=4 && t.hp>=t.maxHp?1.5:0);
  s += H(p.id, t.id)*2.5;                                     // 谁打过我（我收到来自t的伤害）
  if(t.hp<=2) s += 2;                                         // 补刀
  if(t===lord && p.role!=="rebel" && state.players.some(q=>q.alive&&q.role==="rebel")) s -= 4; // 反贼未清先别杀主
  return s;
}
function aiBestTargets(p, list){
  return list.slice().sort((a,b)=> threatScore(p,b)-threatScore(p,a));
}
function aiWantAttackNow(p){ // AI 选一个杀目标（明显不该打的就不打，如忠臣未清反贼时打主公）
  const list = killTargets(p); if(!list.length) return null;
  const best = aiBestTargets(p,list)[0];
  return threatScore(p,best) > 0 ? best : null;
}
async function aiPlay(p){
  let guard = 0;
  while(!state.over && p.alive && guard++ < 30){
    const act = await aiDecide(p);
    if(!act) break;
    await act();
    await sleep(520);
  }
}
async function aiDecide(p){
  const hand = p.hand;
  const find = n => hand.find(c=>c.n===n);
  const lord = P(state.lordId);
  // 1. 桃
  if(p.hp < p.maxHp && !p.f.peachUsed && find("桃")){
    return async()=>{ const c=find("桃"); useCardFrom(p,c); toDiscard(c); p.hp++; p.f.peachUsed=1; addLog(`${gname(p)} 使用了【桃】`,"heal"); render(); await stageShow(p,c,`${gname(p)} 使用了【桃】`); };
  }
  // 2. 装备
  for(const c of hand){ if(c.t==="eq"){
    const slot=c.slot;
    if(!p.eq[slot] || (slot==="weapon" && c.range>p.eq.weapon.range)) return async()=>{ await equipCard(p,c); render(); };
  }}
  // 3. 制衡
  if(hasSkill(p,"制衡") && !p.f.balance && hand.length>=6){
    return async()=>{
      const junk = hand.filter(c=>!["桃","闪"].includes(c.n)).slice(0, Math.min(4, hand.length-2));
      if(!junk.length) return;
      for(const c of junk){ useCardFrom(p,c); toDiscard(c); await stageShow(p,c,`${gname(p)}【制衡】弃掉了【${c.n}】`); }
      draw(p, junk.length); p.f.balance=true; addLog(`${gname(p)} 发动【制衡】，弃${junk.length}摸${junk.length}`,"skill"); render();
    };
  }
  // 3.5 苦肉（黄盖）：缺牌但有输出牌时自苦找牌
  if(hasSkill(p,"苦肉") && p.hp>=3 && (p.f.kuru||0)<2 && hand.length<=3 &&
     (hand.some(c=>c.t==="kill") || hand.some(c=>c.t==="tao"||c.t==="arrow"||c.n==="决斗"))){
    p.f.kuru=(p.f.kuru||0)+1;
    return async()=>{ p.hp--; const g=draw(p,2); addLog(`${gname(p)} 咬牙【苦肉】（失去1点体力），摸${g.length}张牌`,"skill"); flashSeat(p.id); render(); };
  }
  // 3.6 反间（周瑜）
  if(hasSkill(p,"反间") && !p.f.fanjian && p.hp>1 && hand.length>=3){
    const ftl = aiBestTargets(p, foes(p));
    if(ftl.length && threatScore(p,ftl[0])>4.5) return async()=>{ await doFanjian(p, ftl[0]); };
  }
  // 3.7 裸衣（许褚）
  if(hasSkill(p,"裸衣") && !p.f.luoyi && hand.some(c=>c.n==="杀"||c.n==="决斗")){
    return async()=>{ p.f.luoyi=true; const g=draw(p,2); addLog(`${gname(p)}【裸衣】：卸甲摸${g.length}张，本回合【杀】/【决斗】伤害+1`,"skill"); render(); };
  }
  // 3.72 强袭（典韦）
  if(hasSkill(p,"强袭") && !p.f.qiangxi && p.hp>=3){
    const tl = aiBestTargets(p, foes(p).filter(t=>dist(p,t)<=1));
    if(tl.length && threatScore(p,tl[0])>3.5) return async()=>{
      p.f.qiangxi=true; p.hp--; flashSeat(p.id);
      addLog(`${gname(p)}【强袭】：牺牲1点体力 → ${gname(tl[0])}`,"skill"); render();
      await stageShow(p,{id:-77,n:"强袭",s:"♠",num:11,t:"skillfx"},`${gname(p)} 挥大戟强袭 → ${gname(tl[0])}`,STAGE_MS,tl[0]);
      await damage(p, tl[0], 1, null); };
  }
  // 3.74 神速（夏侯渊）
  if(hasSkill(p,"神速") && !p.f.shensu){
    const tl = aiBestTargets(p, killTargets(p).filter(t=>killOk(p,{s:"♠"},t)));
    if(tl.length && (threatScore(p,tl[0])>3.8 || (!killOptions(p,false).filter(c=>c.n==="杀").length && threatScore(p,tl[0])>1.5)))
      return async()=>{ p.f.shensu=true; await useKill(p, tl[0], {id:-78,n:"神速",s:"♠",num:11,t:"kill",virt:true}); };
  }
  // 3.76 青囊（华佗）
  if(hasSkill(p,"青囊") && !p.f.qingnang && hand.length>=2){
    const ally = alive().filter(t=>t!==p && t.hp<=1 && (ISDUI()? t.team===p.team : threatScore(p,t)<2))[0];
    const tgt = (p.hp<=p.maxHp-2) ? p : ally;
    if(tgt) return async()=>{ p.f.qingnang=true;
      const c = hand.find(x=>!["桃","闪"].includes(x.n)) || hand[0];
      useCardFrom(p,c); toDiscard(c); await stageShow(p,c,`${gname(p)}【青囊】弃掉了【${c.n}】`);
      tgt.hp=Math.min(tgt.maxHp,tgt.hp+1); fxLink(p,tgt,"#7dcea0","fxhitg");
      addLog(`${gname(p)}【青囊】：${gname(tgt)} 回复1点体力`,"heal"); render(); };
  }
  // 3.78 离间（貂蝉）：让威胁最大的两个男人互砍
  if(hasSkill(p,"离间") && !p.f.lijian && hand.length>=2){
    const males = foes(p).filter(t=>!isFem(t));
    if(males.length>=2){
      const tl = aiBestTargets(p, males);
      if(tl.length && threatScore(p,tl[0])>3.8){
        const other = males.find(t=>t!==tl[0]);
        return async()=>{ p.f.lijian=true;
          const c = hand.find(x=>!["桃","闪"].includes(x.n)) || hand[0];
          useCardFrom(p,c); toDiscard(c); checkLianYing(p);
          addLog(`${gname(p)}【离间】：${gname(other)} ⚔ ${gname(tl[0])}`,"skill");
          await stageShow(p,c,`${gname(p)}【离间】弃掉了【${c.n}】`,STAGE_MS,[other,tl[0]],"#d7bde2");
          await useDuel(other, tl[0], {id:-79,n:"离间",s:"♠",num:1,t:"duel",virt:true}); };
      }
    }
  }
  // 3.8 结姻（孙尚香）
  if(hasSkill(p,"结姻") && !p.f.jieyin && p.hand.length>=3 && p.hp<=p.maxHp-1){
    const male = (ISDUI()? alive().filter(t=>t!==p && t.team===p.team) : alive()).filter(t=>!isFem(t) && t.hp<t.maxHp)[0];
    if(male) return async()=>{
      const junk = hand.filter(c=>!["桃","闪","杀"].includes(c.n)).slice(0,2);
      if(junk.length<2) return;
      p.f.jieyin=true;
      for(const c of junk){ useCardFrom(p,c); toDiscard(c); await stageShow(p,c,`${gname(p)}【结姻】弃掉了【${c.n}】`); }
      p.hp=Math.min(p.maxHp,p.hp+1); male.hp=Math.min(male.maxHp,male.hp+1);
      fxLink(p,male,"#7dcea0","fxhitg");
      addLog(`${gname(p)}【结姻】：与 ${gname(male)} 各回复1点体力`,"heal"); render(); };
  }
  // 3.9 新锦囊：无中生有 / 桃园结义 / 五谷丰登 / 铁索连环 / 火攻 / 借刀杀人
  const wz = find("无中生有");
  if(wz && hand.length<=5){
    return async()=>{ useCardFrom(p,wz); toDiscard(wz); const g=draw(p,2);
      addLog(`${gname(p)} 使用【无中生有】，摸${g.length}张牌`,"heal"); render();
      await stageShow(p,wz,`${gname(p)}【无中生有】`,STAGE_MS,p,"#f7dc6f"); };
  }
  const oathC = find("桃园结义");
  if(oathC && p.hp<=p.maxHp-1 && alive().filter(x=>x.hp<x.maxHp).length>=Math.ceil(alive().length/2)){
    return async()=>{ await useOath(p, oathC); };
  }
  const bg = find("五谷丰登");
  if(bg && hand.length<=4 && alive().length>=3){ return async()=>{ await useBountiful(p, bg); }; }
  const cch = find("铁索连环");
  if(cch && Math.random()<0.8){ const tl=aiBestTargets(p, foes(p).filter(x=>!x.chained));
    if(tl.length && threatScore(p,tl[0])>4.2) return async()=>{ await useChain(p, tl[0], cch); }; }
  const hg = find("火攻");
  if(hg && hand.length>=4){ const tl=aiBestTargets(p, foes(p).filter(x=>x.hand.length>0));
    const tt = tl[0]; if(tt && threatScore(p,tt)>4.4) return async()=>{ await useFireAttack(p, tt, hg); }; }
  const jd = find("借刀杀人");
  if(jd){ const armed = alive().filter(x=>x!==p && x.eq.weapon && x.hand.length>0);
    const tl = aiBestTargets(p, armed); if(tl.length && threatScore(p,tl[0])>4.4) return async()=>{ await useJiedao(p, tl[0], jd); }; }
  // 4. 酒 + 爆发
  const target = aiBestTargets(p, foes(p))[0];
  if(target && find("酒") && !p.f.wineUsed && p.hp>1 && threatScore(p,target)>4 && canKillMore(p) && hand.some(c=>c.t==="kill")){
    return async()=>{ const c=find("酒"); useCardFrom(p,c); toDiscard(c); p.f.wineUsed=true; p.f.drunk=true; addLog(`${gname(p)} 饮下【酒】`,"skill"); render(); await stageShow(p,c,`${gname(p)} 饮下【酒】`); };
  }
  // 5. 杀（注意于禁毅重：黑杀打不了他）
  const kills = killOptions(p, false).filter(c=> c.real || (c.asIf && c.n!=="桃" && c.n!=="闪" && c.n!=="酒"));
  if(kills.length && canKillMore(p)){
    const use0 = kills.find(c=>c.n==="杀") || kills[0];
    const kcard = syncCard(p, use0);
    const tl = aiBestTargets(p, killTargets(p).filter(t=>killOk(p,kcard,t)));
    const t = (tl.length && threatScore(p,tl[0])>0) ? tl[0] : null;
    if(t){ return async()=>{ await useKill(p, t, kcard); }; }
  }
  // 6. 顺手/拆（含奇袭；拆已无距离限制，优先级更高）
  const dism = find("过河拆桥");
  if(dism){ const tl = aiBestTargets(p, trick1Targets(p,true)); if(tl.length && (threatScore(p,tl[0])>1.2 || cardsOf(tl[0])>=3)) return async()=>{ await aiTakeCard(p, tl[0], dism, true); }; }
  const snatch = find("顺手牵羊");
  if(snatch){ const tl = aiBestTargets(p, trick1Targets(p,false,true)); if(tl.length && threatScore(p,tl[0])>3) return async()=>{ await aiTakeCard(p, tl[0], snatch, false); }; }
  // 7. AOE
  const aoe = find("南蛮入侵") || find("万箭齐发");
  if(aoe && alive().length>=4){ return async()=>{ await useAOE(p, aoe); }; }
  // 8. 决斗
  const duel = find("决斗");
  if(duel && hand.filter(c=>c.n==="杀").length>=1){
    const tl = aiBestTargets(p, foes(p)); if(tl.length && threatScore(p,tl[0])>4) return async()=>{ await useDuel(p, tl[0], duel); };
  }
  // 9. 延时锦囊
  const dly = find("乐不思蜀") || find("兵粮寸断") || find("闪电") || find("水淹七军");
  if(dly){
    const tl = aiBestTargets(p, delayTargets(p));
    if(tl.length && (dly.n!=="闪电" || Math.random()<0.5)) return async()=>{
      useCardFrom(p,dly);
      if(await tryWuxie(tl[0], p, dly)){ toDiscard(dly); render(); return; }
      addLog(`${gname(p)} 对 ${gname(tl[0])} 使用了【${dly.n}】`,"judge");
      tl[0].judge.push(dly); render(); await stageShow(p,dly,`${gname(p)} 对 ${gname(tl[0])} 用【${dly.n}】`);
    };
  }
  // 10. 仁德：给牌给更需要的（AI简化：重伤友军）
  if(hasSkill(p,"仁德") && hand.length>=5){
    const ally = alive().filter(t=>t!==p && t.hp<t.maxHp && (ISDUI()? t.team===p.team : threatScore(p,t)<3))[0];
    if(ally){ return async()=>{
      const gifts = hand.filter(c=>!["桃","闪","杀"].includes(c.n)).slice(0,2);
      if(!gifts.length) return;
      gifts.forEach(c=>useCardFrom(p,c)); ally.hand.push(...gifts);
      addLog(`${gname(p)} 发动【仁德】，把 ${gifts.map(c=>c.n).join("、")} 交给了 ${gname(ally)}`,"skill"); render(); };
    }
  }
  return null;
}
function syncCard(p, useObj){ // killOptions 返回的是副本，找出手牌原件
  const real = p.hand.find(c=>c.n===useObj.n && c.s===useObj.s && c.num===useObj.num);
  if(real){ if(useObj.asIf){ real.asIf = useObj.asIf; } return real; }
  return useObj;
}
async function aiTakeCard(p, t, card, isDiscard){
  useCardFrom(p, card);
  if(await tryWuxie(t, p, card)){ toDiscard(card); render(); return; }
  addLog(`${gname(p)} 对 ${gname(t)} 使用【${card.n}】`);
  await stageShow(p, card, `${gname(p)} 用【${card.n}】指向 ${gname(t)}`, STAGE_MS, t);
  const eqs = ["weapon","armor","plus","minus"].map(s=>t.eq[s]).filter(Boolean);
  let got=null;
  if(eqs.length && Math.random()<0.8){ const c=eqs[0]; t.eq[c.slot]=null; got=c; equipLost(t,c); }
  else if(t.hand.length){ const i=Math.floor(Math.random()*t.hand.length); got=t.hand.splice(i,1)[0]; checkLianYing(t); }
  if(got){
    if(isDiscard){ toDiscard(got); addLog(`${gname(t)} 的【${got.n}】被弃置`);
      await stageShow(p, got, `${gname(p)} 弃掉了 ${gname(t)} 的【${got.n}】`); }
    else{ p.hand.push(got); addLog(`${gname(p)} 获得了【${got.n}】`); }
  }
  toDiscard(card); render();
}
async function equipCard(p, c){
  useCardFrom(p, c);
  const old = p.eq[c.slot]; if(old){ toDiscard(old); equipLost(p,old); }
  p.eq[c.slot] = c;
  addLog(`${gname(p)} 装备了【${c.n}】${c.range?`（范围${c.range}）`:""}`);
  await stageShow(p, c, `${gname(p)} 装备【${c.n}】`);
}
async function aiDiscard(p){
  const VAL = {桃:6,闪:5,杀:4,火杀:4,雷杀:4,酒:4,顺手牵羊:3,过河拆桥:3,万箭齐发:3,决斗:2.5,南蛮入侵:2,乐不思蜀:2,兵粮寸断:2,闪电:1,
    无中生有:4.5,无懈可击:5,桃园结义:2.5,五谷丰登:2.5,铁索连环:1.5,火攻:2.5,借刀杀人:2.5,水淹七军:2};
  const list = [];
  while(p.hand.length > p.hp){
    p.hand.sort((a,b)=>(VAL[a.n]||3)-(VAL[b.n]||3));
    const c = p.hand.shift(); toDiscard(c); list.push(c);
  }
  if(list.length){   // 集中弃牌：一次看全，不再逐张展示
    addLog(`${gname(p)} 弃置 ${list.length} 张牌：${list.map(c=>"【"+c.n+"】").join("")}`,"sys");
    render(); await stageShowMany(p, list, `${gname(p)} 弃置 ${list.length} 张手牌`);
  }
  checkLianYing(p);
}

// ---------- ⑦ 回合流程 ----------
async function takeTurn(p){
  state.turn++;
  addLog(`—— ${gname(p)} 的回合（总第${state.turn}回合） ——`,"turn");
  p.f = {kills:0, peachUsed:0, wineUsed:false, drunk:false, balance:false,
          luoyi:false, qiangxi:false, shensu:false, qingnang:false, lijian:false, jieyin:false, jiUsed:false, fanjian:false};
  // ═ ① 开始阶段（准备事项 + 甄姬洛神） ═
  phaseTip(p, "开始阶段");
  render(); await sleep(420);
  // 准备阶段：甄姬洛神（黑色判定收入手牌，直到红色）
  if(hasSkill(p,"洛神") && p.alive && !state.over){
    addLog(`${gname(p)} 发动【洛神】`,"skill");
    let n = 0;
    while(n++ < 10 && !state.over){
      const c = topJudgeRaw(); const black = !RED(c.s);
      if(black){ p.hand.push(c); addLog(`【洛神】判定 ${c.s}${numName(c.num)}（黑），获得之`,"judge"); render(); await sleep(380); }
      else{ judgeShow(c); addLog(`【洛神】判定 ${c.s}${numName(c.num)}（红），洛神终止`,"judge"); break; }
    }
    render(); if(state.over) return; await sleep(260);
  }
  // ═ ② 判定阶段 ═
  phaseTip(p, "判定阶段"); await sleep(300);
  if(p.judge.length){
    const j = p.judge.shift();
    if(j.n==="乐不思蜀"){ const ok = judge(p,"乐不思蜀"); toDiscard(j); if(!ok){ p.f.feasted=true; addLog(`${gname(p)} 中【乐不思蜀】，跳过出牌阶段`,"judge"); } }
    else if(j.n==="兵粮寸断"){ const c = topJudgeRaw(); const ok = c.s==="♣"; judgeShow(c); toDiscard(j); if(!ok){ p.f.robbed=true; addLog(`${gname(p)} 中【兵粮寸断】，跳过摸牌阶段`,"judge"); } }
    else if(j.n==="闪电"){ const c = topJudgeRaw(); const hit = c.s==="♠" && c.num>=2 && c.num<=9; judgeShow(c);
      if(hit){ toDiscard(j); addLog(`天雷轰顶！`,"dmg"); await damage(null, p, 3, j, "thunder"); }
      else{ const nx = nextAliveAfter(p.id); if(nx){ nx.judge.push(j); addLog(`【闪电】转移给了 ${gname(nx)}`,"judge"); } }
    }
    else if(j.n==="水淹七军"){ const c = topJudgeRaw(); const ok = c.s==="♠"; judgeShow(c); toDiscard(j);
      if(ok) addLog(`${gname(p)} 水淹七军判定为♠，水势退去`,"judge");
      else if(cardsOf(p)>0){ addLog(`水势滔天！${gname(p)} 被冲走一张牌`,"judge"); await discardUpTo(p, p, 1, "水淹七军"); }
      else{ addLog(`水势滔天，${gname(p)} 无牌可弃，遭水灾侵体！`,"dmg"); await damage(null, p, 1, null, "fire"); }
    }
    render(); if(state.over) return; await sleep(350);
  }
  if(!p.alive) return; // 判定阶段被天雷除掉了，回合直接结束
  // ═ ③ 摸牌阶段 ═
  phaseTip(p, "摸牌阶段"); await sleep(300);
  muniuGrab(p); // 木牛流马：摸牌时截获他人货栈
  if(!p.f.robbed){
    const got = draw(p, 2 + (hasSkill(p,"英姿")?1:0));
    if(got.length){
      addLog(`${gname(p)} 摸${got.length}张牌${hasSkill(p,"英姿")?"（英姿）":""}`,"sys");
      render(); await flyDraw(p, got.length);                       // 摸牌动画：牌从场中央飞入角色
      if(NET && NET.host) NET.replay({ type:"draw", a:p.id, n:got.length });
    }
  }
  render(); await sleep(260);
  // ═ ④ 出牌阶段 ═
  phaseTip(p, "出牌阶段"); await sleep(260);
  if(!p.f.feasted && !state.over && p.alive){
    if(p.ai) await aiPlay(p);
    else if(p.ctrl==="remote") await remotePlayPhase(p);
    else await humanPlayPhase(p);
  }
  if(!state.over && p.alive) await muniuStore(p); // 出牌阶段结束：木牛流马藏牌
  if(state.over || !p.alive) return;
  // ═ ⑤ 弃牌阶段 ═
  phaseTip(p, "弃牌阶段"); await sleep(260);
  if(p.hand.length > p.hp){
    if(p.ai) await aiDiscard(p);
    else if(p.ctrl==="remote") await remoteDiscard(p);
    else await humanDiscard(p);
  }
  // ═ ⑥ 结束阶段（貂蝉闭月） ═
  phaseTip(p, "结束阶段"); await sleep(260);
  if(hasSkill(p,"闭月") && p.alive && !state.over){ const g=draw(p,2); if(g.length) addLog(`${gname(p)}【闭月】：摸${g.length}张牌`,"skill"); }
  render(); await sleep(250);
}
function topJudgeRaw(){ if(!state.deck.length){ state.deck=shuffle(state.discard); state.discard=[]; } return state.deck.pop(); }
function judgeShow(c){ addLog(`判定牌：${c.s}${numName(c.num)}`,"judge"); state.discard.push(c); }

async function gameLoop(){
  while(!state.over){
    for(const p of state.players){
      if(state.over) break;
      if(!p.alive) continue;
      state.cur = p; render();
      await takeTurn(p);
    }
  }
  state.cur=null; render();
}

// ---------- ⑧ 人类交互 ----------
function onHumanCard(id){
  if(!state || state.over || window._busy) return;
  const p = me(); const ui = state.ui;
  if(!p || !p.alive) return;
  const card = p.hand.find(c=>c.id===id); if(!card) return;
  if(ui && ui.mode==="pick"){ // 多选（弃牌/制衡/仁德）
    if(ui.sel.has(id)) ui.sel.delete(id); else ui.sel.add(id);
    render(); return;
  }
  if(ui && ui.mode==="target") return;
  if(state.cur!==p) return; // 不是自己回合
  if(NET && !NET.host){ // 客户端：把自己的出牌动作回传给房主执行
    if(NET.turnReqId==null){ addLog("请等待房主同步…","sys"); return; }
    const uses = legalUses(p, card);
    if(!uses.length){ addLog("现在不能使用该牌","sys"); return; }
    const pickUse = idx => { NET.ans(NET.turnReqId, {t:"use", cardId:card.id, useIdx:idx}); NET.turnReqId=null; renderPrompt(); };
    if(uses.length===1) pickUse(0);
    else{ const labels = uses.map(u=>u.label); labels.push("取消");
      askModal(`如何使用【${card.n}】`, "该牌可以多种用法", labels).then(v=>{
        const idx = +String(v).replace("opt",""); if(idx < uses.length) pickUse(idx);
      });
    }
    return;
  }
  const uses = legalUses(p, card);
  if(!uses.length){ addLog("现在不能使用该牌","sys"); return; }
  if(uses.length===1) startUse(p, card, uses[0]);
  else { // 多种用法 → 选择
    const labels = uses.map(u=>u.label); labels.push("取消");
    askModal(`如何使用【${card.n}】`, "该牌可以多种用法", labels).then(v=>{
      const idx = +String(v).replace("opt",""); if(idx < uses.length) startUse(p, card, uses[idx]);
    });
  }
}
function legalUses(p, card){
  const uses = [];
  const T = card.t;
  if(T==="eq") uses.push({label:`装备【${card.n}】`, kind:"equip"});
  if(card.n==="桃" && p.hp<p.maxHp && !p.f.peachUsed) uses.push({label:"使用【桃】回复体力", kind:"peach"});
  if(card.n==="酒" && !p.f.wineUsed) uses.push({label:"饮酒（下一张杀伤害+1）", kind:"wine"});
  if(card.t==="kill" && canKillMore(p)) uses.push({label:`使用【${card.n}】`, kind:"kill"});
  if(["顺手牵羊","过河拆桥"].includes(card.n)) uses.push({label:`使用【${card.n}】`, kind:T});
  if(["决斗"].includes(card.n)) uses.push({label:"使用【决斗】", kind:"duel"});
  if(["南蛮入侵","万箭齐发"].includes(card.n)) uses.push({label:`使用【${card.n}】`, kind:"aoe"});
  if(["乐不思蜀","兵粮寸断","闪电","水淹七军"].includes(card.n)) uses.push({label:`使用【${card.n}】`, kind:"delay"});
  if(card.n==="无中生有") uses.push({label:"使用【无中生有】摸两张牌", kind:"wuzhong"});
  if(card.n==="桃园结义") uses.push({label:"使用【桃园结义】", kind:"oath"});
  if(card.n==="五谷丰登") uses.push({label:"使用【五谷丰登】", kind:"bountiful"});
  if(card.n==="铁索连环") uses.push({label:"使用【铁索连环】", kind:"chain"});
  if(card.n==="火攻") uses.push({label:"使用【火攻】", kind:"fireatk"});
  if(card.n==="借刀杀人") uses.push({label:"使用【借刀杀人】", kind:"jiedao"});
  if(card.n==="无懈可击") uses.push({label:"（被动）当目标锦囊生效前可打出", kind:"none"});
  // 武将转化
  if(hasSkill(p,"武圣") && RED(card.s) && T!=="eq" && T!=="kill" && canKillMore(p))
    uses.push({label:`【武圣】：当【杀】使用`, kind:"kill", asIf:"武圣"});
  if(hasSkill(p,"龙胆") && card.n==="闪" && canKillMore(p))
    uses.push({label:`【龙胆】：当【杀】使用`, kind:"kill", asIf:"龙胆"});
  if(hasSkill(p,"奇袭") && !RED(card.s) && T!=="eq" && card.n!=="过河拆桥")
    uses.push({label:`【奇袭】：当【过河拆桥】使用`, kind:"dismantle", asIf:"奇袭"});
  return uses;
}
// —— 选目标 / 选自己手牌：本地走原有 UI，远程座位走网络往返 ——
function pickTargetUI(p, cand, msg){
  if(NET && NET.host && p.ctrl==="remote") return NET.req(p.id, {kind:"target", cand, msg});
  return new Promise(res=>{ state.ui = {mode:"target", cand, msg,
    onTarget:tid=>{ state.ui=null; res(tid); }, onCancel:()=>res(null)}; render(); });
}
function pickOwnCards(p, need, msg, confirmLabel, noCancel){
  if(NET && NET.host && p.ctrl==="remote") return NET.req(p.id, {kind:"cards", need, msg, confirmLabel, noCancel:!!noCancel});
  return new Promise(res=>{ state.ui = {mode:"pick", need:need||0, sel:new Set(), msg, confirmLabel:confirmLabel||"确定", noCancel:!!noCancel, done:res}; render(); });
}
// 用法是否需要选目标：false=直接结算；否则返回候选与提示
function useTargetSpec(p, card, use){
  const k = use.kind;
  if(k==="equip"||k==="peach"||k==="wine"||k==="aoe"||k==="wuzhong"||k==="oath"||k==="bountiful"||k==="none") return false;
  let cand, msg;
  if(k==="kill"){
    const first = hasSkill(p,"觊延") && !p.f.jiUsed; // 马岱觊延：首杀无距离限制
    cand = alive().filter(t=>t!==p && !isMate(p,t) && (first || dist(p,t)<=rangeOf(p))
      && !(hasSkill(t,"空城")&&t.hand.length===0) && killOk(p,card,t)).map(t=>t.id);
    msg = first? "选择【杀】的目标（【觊延】首杀无距离限制！）" : "选择【杀】的目标";
  }
  else if(k==="duel"){ cand = foes(p).map(t=>t.id); msg="选择【决斗】的目标"; }
  else if(k==="snatch"){ cand = trick1Targets(p, use.asIf==="奇袭", true).map(t=>t.id); msg="选择【顺手牵羊】的目标"; }
  else if(k==="dismantle"){ cand = trick1Targets(p, true, false).map(t=>t.id); msg="选择【过河拆桥】的目标（无距离限制）"; }
  else if(k==="delay"){ cand = delayTargets(p).map(t=>t.id); msg=`选择【${card.n}】的目标`; }
  else if(k==="chain"){ cand = alive().filter(t=>t!==p).map(t=>t.id); msg="选择【铁索连环】的目标"; }
  else if(k==="fireatk"){ cand = foes(p).filter(t=>t.hand.length>0).map(t=>t.id); msg="选择【火攻】的目标（须有手牌）"; }
  else if(k==="jiedao"){ cand = alive().filter(t=>t!==p && t.eq.weapon).map(t=>t.id); msg="选择【借刀杀人】的目标（须装备武器）"; }
  return {cand, msg};
}
// 统一结算入口：本地点击与远程玩家指令都走这里（t=已确定的目标或null）
async function execUse(p, card, use, t){
  const k = use.kind;
  window._busy = true;
  try{
    if(k==="equip"){ await equipCard(p,card); }
    else if(k==="peach"){ useCardFrom(p,card); toDiscard(card); p.hp=Math.min(p.maxHp,p.hp+1); p.f.peachUsed=1;
      addLog(`${gname(p)} 使用了【桃】`,"heal"); render(); await stageShow(p,card,`${gname(p)} 使用了【桃】`,STAGE_MS,p,"#7dcea0","fxhitg"); }
    else if(k==="wine"){ useCardFrom(p,card); toDiscard(card); p.f.wineUsed=true; p.f.drunk=true;
      addLog(`${gname(p)} 饮下了【酒】`,"skill"); render(); await stageShow(p,card,`${gname(p)} 饮下了【酒】`); }
    else if(k==="aoe"){ await useAOE(p, card); }
    else if(k==="wuzhong"){ useCardFrom(p,card); toDiscard(card); const g=draw(p,2);
      addLog(`${gname(p)} 使用【无中生有】，摸${g.length}张牌`,"heal"); render();
      await stageShow(p,card,`${gname(p)}【无中生有】`,STAGE_MS,p,"#f7dc6f"); await flyDraw(p,g.length); }
    else if(k==="oath"){ await useOath(p, card); }
    else if(k==="bountiful"){ await useBountiful(p, card); }
    else if(t){
      if(use.asIf){ card.asIf = use.asIf; }
      if(k==="kill") await useKill(p, t, card);
      else if(k==="duel") await useDuel(p, t, card);
      else if(k==="snatch"||k==="dismantle") await humanTakeOrDiscard(p, t, card, k==="dismantle");
      else if(k==="chain") await useChain(p, t, card);
      else if(k==="fireatk") await useFireAttack(p, t, card);
      else if(k==="jiedao") await useJiedao(p, t, card);
      else if(k==="delay"){ useCardFrom(p,card);
        if(await tryWuxie(t, p, card)){ toDiscard(card); render(); return; }
        addLog(`${gname(p)} 对 ${gname(t)} 使用了【${card.n}】`,"judge"); render();
        await stageShow(p,card,`${gname(p)} 对 ${gname(t)} 使用了【${card.n}】`, STAGE_MS, t); t.judge.push(card); }
    }
  } finally { window._busy = false; render(); }
}
async function startUse(p, card, use){
  if(window._busy) return;
  const spec = useTargetSpec(p, card, use);
  if(spec===false){ await execUse(p, card, use, null); return; }
  if(!spec.cand.length){ addLog("没有合法目标","sys"); return; }
  const tid = await pickTargetUI(p, spec.cand, spec.msg);
  if(tid==null){ render(); return; }
  await execUse(p, card, use, P(tid));
}
async function humanTakeOrDiscard(p, t, card, isDiscard){
  useCardFrom(p, card);
  if(await tryWuxie(t, p, card)){ toDiscard(card); render(); return; }
  await stageShow(p, card, `${gname(p)} 对 ${gname(t)} 使用【${card.n}】`, STAGE_MS, t);
  const eqs = ["weapon","armor","plus","minus"].map(s=>t.eq[s]).filter(Boolean);
  const labels = []; const acts = [];
  if(t.hand.length){ labels.push(`手牌（随机抽取）`); acts.push("hand"); }
  eqs.forEach(c=>{ labels.push(`装备【${c.n}】`); acts.push(c); });
  if(!labels.length){ addLog(`${gname(t)} 没有牌可拿`,"sys"); toDiscard(card); render(); return; }
  const v = await askP(p, `选择要${isDiscard?"弃置":"顺走"}的牌`, `${gname(t)} 的公开装备与未知手牌`, labels, t.gid);
  const a = acts[+String(v).replace("opt","")];
  let got=null;
  if(a==="hand"){ const i=Math.floor(Math.random()*t.hand.length); got=t.hand.splice(i,1)[0]; checkLianYing(t); addLog(`抽到了【${got.n}】`); }
  else{ t.eq[a.slot]=null; got=a; equipLost(t,a); }
  if(isDiscard){ toDiscard(got); addLog(`${gname(p)} 弃置了 ${gname(t)} 的【${got.n}】`);
    await stageShow(p, got, `${gname(p)} 弃置了 ${gname(t)} 的【${got.n}】`); }
  else{ p.hand.push(got); addLog(`${gname(p)} 获得了【${got.n}】`); }
  toDiscard(card); render();
}
function humanPlayPhase(p){
  state.ui = null;
  return new Promise(res=>{ window._endPlay = res; render();
    if(AUTO && p===me()) setTimeout(()=>endPlay(), 200); });
}
function endPlay(){
  if(!state || state.over) return;
  const m = me(); if(!m) return;
  if(NET && !NET.host){ // 客户端点"结束出牌" → 把指令回传房主
    if(state.cur===m && NET.turnReqId!=null){ NET.ans(NET.turnReqId, {t:"end"}); NET.turnReqId=null; renderPrompt(); }
    return;
  }
  if(state.cur===m && !window._busy && window._endPlay){ const res=window._endPlay; window._endPlay=null; res(); }
}
async function humanDiscard(p){
  const n = p.hand.length - p.hp;
  const ids = await pickOwnCards(p, n, `手牌数超过体力值，弃置 ${n} 张`, "确定弃置", true);
  state.ui = null;
  const list = [];
  for(const id of (ids||[])){
    const i=p.hand.findIndex(c=>c.id===id); if(i<0) continue;
    const c=p.hand.splice(i,1)[0]; toDiscard(c); list.push(c);
  }
  if(list.length){   // 集中弃牌：一次看全
    addLog(`${gname(p)} 弃置 ${list.length} 张牌：${list.map(c=>"【"+c.n+"】").join("")}`,"sys");
    render(); await stageShowMany(p, list, `${gname(p)} 弃置 ${list.length} 张手牌`);
    checkLianYing(p);
  }
  render();
}
function onSeatClick(id){
  const ui = state.ui;
  if(!ui || ui.mode!=="target") return;
  if(!ui.cand.includes(id)) return;
  const run = ui.onTarget; state.ui = null; render();
  run(id);
}
function cancelUI(){
  const ui = state.ui; if(!ui) return;
  if(ui.mode==="pick"){
    if(ui.noCancel) return;                 // 弃牌阶段不可取消
    state.ui = null; if(ui.done) ui.done(null); render(); return; // 制衡/仁德：放弃选择，牌不丢
  }
  state.ui = null; if(ui.onCancel) ui.onCancel(); render();
}
function confirmPick(){
  const ui = state.ui; if(!ui || ui.mode!=="pick") return;
  if(ui.sel.size < (ui.need||1)) return;
  const ids = [...ui.sel];
  state.ui = null; render();
  if(ui.done) ui.done(ids);
}
// —— 主动技能统一体系：本地按钮 / 远程指令 / 结算逻辑三者共用同一批 act 函数 ——
function availableSkills(p){
  const L=[], F=p.f||{};
  if(!p.alive || state.over || state.cur!==p) return L;
  if(hasSkill(p,"制衡") && !F.balance) L.push("制衡");
  if(hasSkill(p,"仁德")) L.push("仁德");
  if(hasSkill(p,"苦肉") && p.hp>1) L.push("苦肉");
  if(hasSkill(p,"反间") && !F.fanjian && p.hp>1 && p.hand.length>=1) L.push("反间");
  if(hasSkill(p,"强袭") && !F.qiangxi && p.hp>1 && alive().some(t=>t!==p&&dist(p,t)<=1)) L.push("强袭");
  if(hasSkill(p,"裸衣") && !F.luoyi) L.push("裸衣");
  if(hasSkill(p,"神速") && !F.shensu) L.push("神速");
  if(hasSkill(p,"青囊") && !F.qingnang && p.hand.length>0 && alive().some(t=>t.hp<t.maxHp)) L.push("青囊");
  if(hasSkill(p,"离间") && !F.lijian && p.hand.length>=1 && foes(p).filter(t=>!isFem(t)).length>=2) L.push("离间");
  if(hasSkill(p,"结姻") && !F.jieyin && p.hand.length>=2 && p.hp<p.maxHp && alive().some(t=>t!==p && !isFem(t) && t.hp<t.maxHp)) L.push("结姻");
  return L;
}
function humanSkillBtn(name){

function actSkillFor(p, name){

    case "仁德": return actRende(p);
    case "苦肉": return actKuru(p);
    case "反间": return actFanjian(p);
    case "强袭": return actQiangxi(p);
    case "裸衣": return actLuoyi(p);
    case "神速": return actShensu(p);
    case "青囊": return actQingnang(p);
    case "离间": return actLijian(p);
    case "结姻": return actJieyin(p);
  }
  return Promise.resolve();
}
async function actBalance(p){

  t.hand.push(card);
  if(guess===card.s){ addLog(`${gname(t)} 猜对，获得了这张【${card.n}】`,"skill"); }
  else{ addLog(`${gname(t)} 猜错，受到1点伤害`,"dmg"); await damage(p, t, 1, null); }
  render();
}

function canHumanClick(card){ // 是否可点（仅用于置灰）
  const p=me(); if(!p || state.cur!==p || !p.alive || state.over) return false;
  return legalUses(p, card).length>0;
}

// 各人数身份配置（2~8人场）
const ROLE_TABLE = {2:["lord","rebel"], 3:["lord","rebel","minion"], 4:["lord","loyal","rebel","rebel"],
  5:["lord","loyal","rebel","rebel","minion"], 6:["lord","loyal","rebel","rebel","rebel","minion"],
  7:["lord","loyal","loyal","rebel","rebel","rebel","minion"], 8:["lord","loyal","loyal","rebel","rebel","rebel","rebel","minion"]};
function newGameReal(plan){
  hideHome();
  plan = plan || {n:5};
  state = newState();
  state.mode = plan.mode==="dui" ? "dui" : "id";
  const dui = state.mode==="dui";
  if(dui) state.lordId = 0; // 团战无主公，占位防引用
  state.youSeat = plan.you!=null ? plan.you : 0;
  const n = dui ? 4 : (ROLE_TABLE[plan.n] ? plan.n : 5);
  let ids = Object.keys(GENERALS); shuffle(ids);
  // 测试专用：?onlynew=dianwei,zhenji,... 强制武将池（便于回归测试），正常游戏不带此参数
  const _only = (location.search.match(/onlynew=([\w,]+)/)||[])[1];
  if(_only){ const want=_only.split(","); const f=ids.filter(k=>want.includes(k));
    if(f.length) ids = Array.from({length:30},(_,i)=>f[i%f.length]); }
  const roles = dui ? null : shuffle(ROLE_TABLE[n].slice());
  for(let i=0;i<n;i++){
    const gid = ids[i % ids.length];
    const g = GENERALS[gid];
    const ctrl = plan.ctrl ? (plan.ctrl[i]||"ai") : (i===(plan.you||0)?"local":"ai");
    const lordBonus = roles && roles[i]==="lord" ? 1 : 0;
    state.players.push({
      id:i, isHuman:i===(plan.you||0), ctrl, ai:ctrl==="ai", pname:(plan.names&&plan.names[i])||null,
      gid, role:roles?roles[i]:null, team:i%2,
      roleKnown: roles ? (roles[i]==="lord" || i===(plan.you||0)) : false,
      maxHp:g.hp+lordBonus, hp:g.hp+lordBonus, hand:[], judge:[],
      eq:{weapon:null,armor:null,plus:null,minus:null}, alive:true, f:{},
    });
    if(roles && roles[i]==="lord") state.lordId = i;
  }
  state.players.forEach(p=>draw(p,4));
  if(dui){
    addLog(`牌局开始（2v2团战）：蓝队（1、3号位）对阵 红队（2、4号位）——灭对方全队即胜，无身份奖惩`,"turn");
  }else{
    const cnt = r => roles.filter(x=>x===r).length;
    addLog(`牌局开始（${n}人场${n===8?"·军争":""}）：主公1、忠臣${cnt("loyal")}、反贼${cnt("rebel")}、内奸${cnt("minion")}`,"turn");
  }
  render();
  showStart();
}

function rerollGeneral(){
  const h = me();

  showStart();
}

function makeNET(mode, room, isHost, nick){
  const N = { mode, room, host:isHost, nick,
    uid:"u"+Math.random().toString(36).slice(2,10),
    mySeat:isHost?0:null, hostUid:null, uidOfSeat:{}, seatOfUid:{}, names:isHost?{0:"房主"}:{},
    lastSeen:{}, pend:{}, reqSeq:0, turnReqId:null, started:false, _snapT:null, _finShown:false };
  if(isHost) N.uidOfSeat[0] = N.uid;
  const send = o => { if(!isHost && mode==="bcast") o.to = "host"; N._tx(Object.assign({from:N.uid}, o)); };
  N.send = send;
  /* ---- 传输层 ---- */
  N._startPoll = () => (async function poll(){ for(;;){ try{
      const r = await fetch(`/api/get?room=${N.room}&uid=${N.uid}`).then(x=>x.json());
      if(r.err) { const st=document.getElementById("joinStatus"); if(st) st.textContent="❌ "+r.err; }
      (r.msgs||[]).forEach(m=>N._rx(m));
      if(!r.ok) await new Promise(r2=>setTimeout(r2,1200));
    }catch(e){ await new Promise(r2=>setTimeout(r2,1200)); } } })();
  if(mode==="bcast"){
    const ch = new BroadcastChannel("sgs-"+N.room);
    ch.onmessage = ev => N._rx(ev.data);
    N._tx = o => { try{ ch.postMessage(o); }catch(e){} };
  }else{
    N._tx = o => { fetch("/api/put",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({room:N.room, from:N.uid, to:o.to, msg:o})}).catch(()=>{ N._failN=(N._failN||0)+1;
          if(N._failN<=6) addLog("⚠ 联机消息发送失败","sys"); else if(N._failN===7) addLog("⚠ 与服务器失联，重试转为静默（若为宾客请等待房主托管或刷新）","sys"); }); };
  }
  /* ---- 房主侧 ---- */
  function hostRx(m){
    if(m.type==="hello"){
      if(N.started){ send({to:m.from, type:"err", msg:"牌局已进行中，请等待下一局"}); return; }
      let seat=1; while(N.uidOfSeat[seat]) seat++;
      if(seat>7){ send({to:m.from, type:"err", msg:"房间已满（最多8人）"}); return; }
      N.uidOfSeat[seat]=m.from; N.seatOfUid[m.from]=seat; N.names[seat]=m.name||("玩家"+seat); N.lastSeen[seat]=Date.now();
      addLog(`${N.names[seat]} 加入了房间（${seat}号位）`,"sys");
      send({to:m.from, type:"welcome", seat, room});
      lobbyRefresh();
      return;
    }
    if(m.type==="ping"){ const s=N.seatOfUid[m.from]; if(s!=null) N.lastSeen[s]=Date.now(); return; }
    if(m.type==="ans"){ const r=N.pend[m.for]; const s=N.seatOfUid[m.from]; if(s!=null) N.lastSeen[s]=Date.now();
      if(r){ delete N.pend[m.for]; r(m.val); } return; }
    if(m.type==="bye"){ const s=N.seatOfUid[m.from]; if(s!=null){ N.lastSeen[s]=0; addLog(`${N.names[s]||s+"号位"} 离开了房间`,"sys"); } return; }
  }
  N.req = (seat, data) => new Promise(res=>{
    const id = ++N.reqSeq; let done=false;
    N.pend[id] = v => { if(done) return; done=true; clearTimeout(tt); res(v); };
    send({to:N.uidOfSeat[seat], type:"req", id, data});
    const tt = setTimeout(()=>{ if(!done){ done=true; res(null); } }, 120000); // 超时视为掉线托管
  });
  N.aliveSeat = s => s===0 || (Date.now()-(N.lastSeen[s]||0) < 95000);
  N.replay = ev => { for(const k in N.uidOfSeat){ const s=+k; if(s!==0 && N.aliveSeat(s)) send({to:N.uidOfSeat[s], type:"fx", ev}); } };
  N.snapSoon = () => { if(N._snapT || !state) return; N._snapT = setTimeout(()=>{ N._snapT=null; N.broadcast(); }, 130); };
  N.broadcast = () => { if(!state) return;
    for(const k in N.uidOfSeat){ const s=+k; if(s!==0 && N.uidOfSeat[k]) send({to:N.uidOfSeat[k], type:"snap", snap:buildSnap(s)}); } };
  function lobbyRefresh(){
    if(N.started) return;
    const list = Object.keys(N.names).map(s=>`<li>${avatarHTML("caocao","sm")} ${N.names[s]} — ${s}号位${+s===0?"（你·房主）":""}</li>`).join("");
    const cnt = Object.keys(N.names).length;
    const panel = document.getElementById("modalPanel");
    panel.innerHTML = `<h2>🎮 开黑大厅</h2>
      <div id="lobby"><div class="code">${N.room}</div>
      <div class="sub" style="max-height:none">把这串地址发给好友：${mode==="bcast"?"（同一浏览器新标签打开 <code>?mp=bcast&room="+N.room+"</code>）":location.origin+"/?mp=net&room="+N.room}</div>
      <ul class="plist">${list}</ul>
      <div class="sub" style="max-height:none">2人即可开局，未入座座位由AI补位。<br>对局模式：
        <select id="mpModeSel" onchange="NET.selMode=this.value" style="padding:3px 6px;border-radius:6px;border:1px solid #8a6d3b;background:#f7efd9;color:#3f3222">
          <option value="5">身份战 · 标准5人（自动扩场）</option>
          <option value="8">军争 · 8人（主1忠2反4内1）</option>
          <option value="dui">2v2 团战（无身份·只取前4座）</option>
        </select></div></div>
      <div class="btns">
        <button onclick="mpStart()" ${cnt>=2?"":"disabled"}>开始对局（已${cnt}人）</button>
        <button onclick="location.reload()">取消</button>
      </div>`;
    const sel = panel.querySelector("#mpModeSel"); if(sel) sel.value = N.selMode||"5";
    document.getElementById("modal").classList.remove("hidden"); window._modalOpen = true;
    if(AUTO && cnt>=2) setTimeout(()=>{ try{ mpStart(); }catch(e){} }, 300);
  }
  N.lobbyRefresh = lobbyRefresh;
  /* ---- 客户端侧 ---- */
  function guestRx(m){
    if(m.to && m.to!=="all" && m.to!==N.uid) return; // 广播频道里的别人家消息
    if(m.type==="welcome"){
      N.mySeat = m.seat; N.hostUid = m.from; N.started = true;
      document.getElementById("modalPanel").innerHTML =
        `<h2>已入座 ${m.seat} 号位</h2><div class="sub">等待房主开局…<br>你是${{1:"二",2:"三",3:"四",4:"五",5:"六",6:"七",7:"八"}[m.seat]||m.seat+"号"}座，开局后座位会以你的视角重新排布。</div>`;
      setTimeout(()=>{ document.getElementById("modal").classList.add("hidden"); window._modalOpen=false; }, 1400);
      setInterval(()=>{ if(N.hostUid) send({to:N.hostUid, type:"ping"}); }, 10000); // 心跳
      return;
    }
    if(m.type==="err"){ document.getElementById("modalPanel").innerHTML = `<h2>无法加入</h2><div class="sub">${m.msg}</div><div class="btns"><button onclick="location.reload()">返回</button></div>`; return; }
    if(m.type==="snap"){ applySnap(m.snap); return; }
    if(m.type==="fx"){ replayFx(m.ev); return; }
    if(m.type==="req"){ guestRespond(m.id, m.data); return; }
  }
  function guestRespond(id, d){
    if(!state && d.kind!=="opts") return;
    if(d.kind==="opts"){ askModal(d.title, d.sub, d.labels).then(v=>N.ans(id, v)); return; }
    if(d.kind==="target"){
      state.ui = {mode:"target", cand:d.cand, msg:d.msg,
        onTarget:tid=>{ state.ui=null; render(); N.ans(id, tid); },
        onCancel:()=>{ N.ans(id, null); }};
      render(); return;
    }
    if(d.kind==="cards"){
      pickOwnCards(P(state.youSeat), d.need, d.msg, d.confirmLabel, d.noCancel).then(ids=>N.ans(id, ids)); return;
    }
    if(d.kind==="turn"){ N.turnReqId = id; render();
      if(AUTO) setTimeout(()=>{ if(N.turnReqId===id){ N.ans(id, {t:"end"}); N.turnReqId=null; renderPrompt(); } }, 260);
      return; }
  }
  N.ans = (reqId, val) => send({to:N.hostUid, type:"ans", for:reqId, val});
  N._rx = isHost ? hostRx : guestRx;
  N.boot = () => {
    if(isHost){
      if(mode==="net"){
        fetch("/api/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({room:N.room})})
          .then(x=>x.json()).then(r=>{ if(!r.ok){ alert("创建房间失败："+r.err); return; }
            N.uid=r.uid; N.room=r.room; N.uidOfSeat[0]=N.uid; N.names[0]="房主";
            N._startPoll(); N.lobbyRefresh(); })
          .catch(()=>alert("连不上服务器：请确认已在游戏目录运行 node server.js，并通过 http 地址打开本页"));
      } else N.lobbyRefresh();
    }else{
      if(mode==="bcast"){ send({to:"all", type:"hello", name:N.nick}); return; }
      fetch("/api/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({room:N.room, name:N.nick})})
        .then(x=>x.json()).then(r=>{ if(!r.ok){ const st=document.getElementById("joinStatus")||document.getElementById("modalPanel"); if(st) st.innerHTML="<h2>无法加入</h2><div class='sub'>"+(r.err||"连接失败")+"</div>"; return; }
          N.uid=r.uid; N.hostUid=r.hostUid;
          N._startPoll();
          send({to:r.hostUid, type:"hello", name:N.nick}); })
        .catch(()=>{ const st=document.getElementById("joinStatus"); if(st) st.textContent="❌ 无法连接服务器"; });
    }
  };
  window.addEventListener("beforeunload", ()=>{ try{ send({to:isHost?"all":N.hostUid, type:"bye"}); }catch(e){} });
  return N;
}
function mpStart(){
  const N = NET; if(!N || !N.host || N.started) return;
  const sel = N.selMode || (document.getElementById("mpModeSel")||{}).value || "5";
  const dui = sel==="dui";
  const joined = Object.keys(N.names).map(Number);
  const n = dui ? 4 : (sel==="8" ? 8 : (joined.length<=2 ? 5 : Math.min(8, joined.length)));
  const ctrl = {}; for(let i=0;i<n;i++) ctrl[i] = joined.includes(i) ? (i===0?"local":"remote") : "ai";
  N.started = true;
  window._modalOpen = false; document.getElementById("modal").classList.add("hidden");
  newGameReal({n, mode: dui?"dui":"id", you:0, ctrl, names:N.names});
}
/* —— 房主：远程座位的出牌/弃牌阶段 —— */
async function remotePlayPhase(p){
  while(!state.over && p.alive){
    if(!NET.aliveSeat(p.id)){
      addLog(`${gname(p)} 掉线，由AI自动托管`,"sys"); p.ctrl="ai"; p.ai=true; await aiPlay(p); return;
    }
    const a = await NET.req(p.id, {kind:"turn", skills: availableSkills(p)});
    if(!a){ if(!NET.aliveSeat(p.id)){ addLog(`${gname(p)} 失去响应，AI托管`,"sys"); p.ctrl="ai"; p.ai=true; await aiPlay(p); return; } continue; }
    if(a.t==="end") break;
    if(a.t==="skill"){ try{ await actSkillFor(p, a.name); }catch(e){ addLog("⚠ 技能异常: "+((e&&e.message)||e),"sys"); } render(); continue; }
    if(a.t==="use"){
      const c = p.hand.find(x=>x.id===a.cardId); if(!c) continue;
      const uses = legalUses(p, c); if(!uses.length) continue;
      const u = uses[Math.min(a.useIdx||0, uses.length-1)]; if(!u) continue;
      const spec = useTargetSpec(p, c, u);
      try{
        if(spec===false) await execUse(p, c, u, null);
        else{
          if(!spec.cand.length) continue;
          const tid = await NET.req(p.id, {kind:"target", cand:spec.cand, msg:spec.msg});
          if(tid==null) continue;
          await execUse(p, c, u, P(tid));
        }
      }catch(e){ addLog("⚠ 结算异常: "+((e&&e.message)||e),"sys"); }
    }
  }
}
async function remoteDiscard(p){ // 房主直接向远程座位发起弃牌请求（带失联托管兜底）
  const n = p.hand.length - p.hp;
  const ids = await NET.req(p.id, {kind:"cards", need:n, msg:`手牌数超过体力值，弃置 ${n} 张`, confirmLabel:"确定弃置", noCancel:true});
  if(ids==null){ addLog(`${gname(p)} 失联，AI托管弃牌`,"sys"); p.ctrl="ai"; p.ai=true; await aiDiscard(p); return; }
  const list = [];
  for(const id of ids){
    const i = p.hand.findIndex(c=>c.id===id); if(i<0) continue;
    const c = p.hand.splice(i,1)[0]; toDiscard(c); list.push(c);
  }
  if(list.length){   // 集中弃牌：一次看全
    addLog(`${gname(p)} 弃置 ${list.length} 张牌：${list.map(c=>"【"+c.n+"】").join("")}`,"sys");
    render(); await stageShowMany(p, list, `${gname(p)} 弃置 ${list.length} 张手牌`);
    checkLianYing(p);
  }
  render();
}
/* —— 快照与客户端重放 —— */
function buildSnap(forSeat){
  const cp = c => c?{id:c.id,n:c.n,s:c.s,num:c.num,t:c.t,slot:c.slot,range:c.range,eff:c.eff,stash:(c.stash?c.stash.length:0)}:null;
  return {
    youSeat:forSeat, turn:state.turn, cur:state.cur?state.cur.id:null, over:state.over, lordId:state.lordId, md:state.mode||"id",
    win:state.win||null, why:state.why||"",
    deckN:state.deck.length, discardN:state.discard.length,
    log:(state.logM||[]).slice(-100), names:NET?NET.names:{},
    seats:state.players.map(p=>({
      id:p.id, gid:p.gid, role:p.role, rk:p.roleKnown, tm:p.team, alive:p.alive, hp:p.hp, maxHp:p.maxHp,
      hc:p.hand.length, hand:p.id===forSeat?p.hand.map(c=>Object.assign({},c)):null,
      judge:p.judge.map(j=>({n:j.n})),
      eq:{weapon:cp(p.eq.weapon),armor:cp(p.eq.armor),plus:cp(p.eq.plus),minus:cp(p.eq.minus)},
      ch:p.chained?1:0,
      f:Object.assign({},p.f), ctrl:p.ctrl,
    })),
  };
}
function applySnap(s){
  const had = !!state && !!NET.turnReqId; // 房主在提示应答期间不会广播，快照到达即可清除待办
  if(!state) state = newState();
  state.youSeat = s.youSeat; state.turn = s.turn; state.lordId = s.lordId; state.over = s.over; state.mode = s.md||"id";
  state.deck = new Array(s.deckN||0); state.discard = new Array(s.discardN||0);
  state.hostility = {}; state.players = s.seats.map(d=>({
    id:d.id, gid:d.gid, role:d.role, roleKnown:d.rk, team:d.tm, alive:d.alive, hp:d.hp, maxHp:d.maxHp,
    hand: d.id===s.youSeat ? (d.hand||[]).map(c=>Object.assign({},c))
        : new Array(d.hc||0).fill(0).map((_,i)=>({id:-1000000-d.id*1000-i, n:"?", s:"♠", num:0, t:"hidden"})),
    judge:(d.judge||[]).map(j=>({n:j.n})),
    eq:{weapon:d.eq.weapon?Object.assign({},d.eq.weapon):null, armor:d.eq.armor?Object.assign({},d.eq.armor):null,
        plus:d.eq.plus?Object.assign({},d.eq.plus):null, minus:d.eq.minus?Object.assign({},d.eq.minus):null},
    f:d.f||{}, isHuman:d.id===s.youSeat, ctrl:d.ctrl==="local"?"local":(d.ctrl==="remote"?"remote":"ai"),
    ai:d.ctrl==="ai", pname:(s.names&&s.names[d.id])||null, chained:!!d.ch,
  }));
  state.players.forEach(v=>{ const a=v.eq.armor; if(a&&typeof a.stash==="number") a.stash = new Array(a.stash).fill(null).map((_,i)=>({id:-2000000-v.id*100-i,n:"?",s:"♠",num:0,t:"hidden"})); });
  state.cur = s.cur==null ? null : state.players[s.cur];
  if(!had) state.ui = null;
  const box = document.getElementById("log");
  box.innerHTML = ""; (s.log||[]).forEach(([t,c])=>{ const el=document.createElement("p"); el.textContent=t; if(c) el.className=c; box.appendChild(el); });
  hideHome(); render();
  if(s.over && !NET._finShown && s.win){ NET._finShown = true; state.over = false; finish(s.win, s.why || "牌局结束"); }
}
function replayFx(ev){
  if(!state) return;
  if(ev.type==="draw"){ const a = P(ev.a); _stageQ = _stageQ.then(async()=>{ await flyDraw(a, ev.n); }).catch(()=>{}); return; }
  if(ev.type!=="stage") return;
  const a = ev.a!=null ? P(ev.a) : null;
  const bs = ev.b==null ? null : (Array.isArray(ev.b)?ev.b:[ev.b]).map(i=>P(i)).filter(Boolean);
  _stageQ = _stageQ.then(async ()=>{
    if(ev.cards && ev.cards.length){
      playStageMany(a, ev.cards, ev.text);
      await sleep(Math.max(1600, Math.min(STAGE_MS*1.8, STAGE_MS + ev.cards.length*160)));
    }else{
      playStage(ev.card, ev.text, a, bs, ev.fx, ev.fxStyle);
      await sleep(STAGE_MS);
    }
    const el = document.getElementById("stage"); if(el) el.classList.remove("on");
  }).catch(()=>{});
}

/* —— 主页：进入文件先进主页；?auto / ?mp= / ?room= 直达对局 —— */
function hideHome(){ const h=document.getElementById("home"); if(h) h.classList.add("hidden"); }
function homeSingle(mode){ if(state && !state.over){ hideHome(); return; } hideHome(); _bootStart(mode); }
function homeNet(){ openModeMenu(); }
let _bootDone = false;
function _bootStart(modeArg){                              // 玩法规则 → 单机开局（mode: id5/id8/dui，也可用 ?mode=8 / ?mode=dui）/ 自动入房
  return showRules().then(()=>{
    const q = new URLSearchParams(location.search);
    if(q.has("room") && !q.has("mp")) q.set("mp", "net");  // 简化版链接：?room=CODE 即加入
    if(q.has("mp")){
      const mode = q.get("mp")==="bcast" ? "bcast" : "net";
      const room = (q.get("room")||"K001").toUpperCase();
      if(q.has("host")){ NET = makeNET(mode, room, true, "房主"); NET.boot(); }
      else{
        NET = makeNET(mode, room, false, q.get("nick")||("玩家"+Math.floor(10+Math.random()*90)));
        document.getElementById("modalPanel").innerHTML = `<h2>连接房间 ${room}…</h2><div class="sub" id="joinStatus">正在连接房主…</div>`;
        document.getElementById("modal").classList.remove("hidden"); window._modalOpen = true;
        NET.boot();
      }
      return;
    }
    const mv = modeArg || q.get("mode") || "";
    newGameReal(mv==="dui" ? {n:4, mode:"dui"} : (mv==="8"||mv==="id8") ? {n:8} : {n:5});
  });
}
(function bootstrap(){
  const q = new URLSearchParams(location.search);
  if(AUTO || q.has("mp") || q.has("room")){ _bootStart(); return; }   // 测试/联机链接不进主页
  document.getElementById("home").classList.remove("hidden");         // 普通进入：先展示主页
})();
</script>
